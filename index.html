<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reconcile Tool</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ── SST CPA Design Tokens ── */
    :root {
      --bg:        #f4f6f5;
      --surface:   #ffffff;
      --surface2:  #f0f4f2;
      --surface3:  #e4ede9;
      --border:    #d0dbd6;
      --border2:   #b0c4bc;
      --text:      #0d2b24;
      --text2:     #3d6055;
      --text3:     #7a9e94;
      --teal:      #0a3d32;
      --teal-mid:  #0d5c49;
      --teal-light:#1a7a61;
      --teal-dim:  #e0eeea;
      --teal-bg:   rgba(10,61,50,.08);
      --green:     #16a34a;
      --green-dim: #dcfce7;
      --green-bg:  rgba(22,163,74,.10);
      --red:       #dc2626;
      --red-dim:   #fee2e2;
      --red-bg:    rgba(220,38,38,.10);
      --mono:      'JetBrains Mono', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; }

    /* ── Header ── */
    header {
      border-bottom: 1px solid var(--border);
      padding: 0 40px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--surface);
      position: sticky; top: 0; z-index: 100;
    }
    .logo-mark {
      width: 28px; height: 28px;
      background: var(--teal);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    header h1 { font-size: 1rem; font-weight: 600; letter-spacing: -.01em; color: var(--teal); }
    header .sep { color: var(--border2); font-size: 1.2rem; font-weight: 200; }
    header .sub { font-size: .82rem; color: var(--text3); }
    .badge {
      margin-left: auto;
      background: var(--teal-dim);
      color: var(--teal);
      border: 1px solid rgba(10,61,50,.2);
      font-size: .68rem; padding: 2px 8px; border-radius: 4px;
      font-weight: 600; letter-spacing: .8px; text-transform: uppercase;
      font-family: var(--mono);
    }
    .ai-badge {
      background: rgba(22,163,74,.12);
      color: var(--green);
      border: 1px solid rgba(22,163,74,.25);
      font-size: .68rem; padding: 2px 8px; border-radius: 4px;
      font-weight: 600; letter-spacing: .8px; text-transform: uppercase;
      font-family: var(--mono);
    }

    /* ── Layout ── */
    .upload-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 28px 40px 0; }

    .upload-card {
      background: var(--surface);
      border-radius: 8px;
      padding: 24px;
      border: 1px solid var(--border);
      transition: border-color .15s;
      cursor: pointer;
    }
    .upload-card.dragover { border-color: var(--teal-mid); box-shadow: 0 0 0 3px var(--teal-bg); }
    .upload-card.loaded   { border-color: var(--green); cursor: default; }
    .upload-card .year-label {
      font-size: .68rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
      color: var(--text3); margin-bottom: 6px; font-family: var(--mono);
    }
    .upload-card h2 { font-size: .95rem; font-weight: 600; margin-bottom: 16px; color: var(--text); }

    .drop-zone {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; padding: 32px 20px; border-radius: 6px;
      background: var(--surface2);
      border: 1px dashed var(--border2);
      transition: border-color .15s;
    }
    .upload-card.dragover .drop-zone { border-color: var(--teal-mid); }
    .drop-zone svg { color: var(--text3); }
    .drop-zone p { font-size: .88rem; color: var(--text2); text-align: center; }
    .drop-zone p strong { color: var(--teal-mid); cursor: pointer; }
    .drop-zone .file-types { font-size: .72rem; color: var(--text3); font-family: var(--mono); }
    input[type="file"] { display: none; }

    .file-info {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; background: var(--green-bg);
      border: 1px solid rgba(34,197,94,.2);
      border-radius: 6px; margin-top: 4px;
    }
    .file-info svg { color: var(--green); flex-shrink: 0; }
    .file-info .fname { font-size: .84rem; font-weight: 500; color: var(--green); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--mono); }
    .file-info .fmeta { font-size: .72rem; color: var(--text3); }
    .clear-btn { margin-left: auto; background: none; border: none; cursor: pointer; color: var(--text3); padding: 3px; border-radius: 4px; display: flex; align-items: center; flex-shrink: 0; }
    .clear-btn:hover { color: var(--red); background: var(--red-bg); }

    .detected-cols { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
    .col-pill {
      font-size: .68rem; font-weight: 500; padding: 2px 7px; border-radius: 4px;
      background: var(--surface3); color: var(--text2);
      border: 1px solid var(--border2); font-family: var(--mono);
    }

    /* ── Actions ── */
    .actions { display: flex; justify-content: center; padding: 24px 40px 0; gap: 10px; flex-wrap: wrap; }

    .btn-ai {
      background: var(--teal); color: #fff;
      border: none; padding: 10px 28px; border-radius: 6px;
      font-size: .88rem; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; gap: 7px;
      transition: opacity .15s, transform .1s;
      font-family: 'Inter', sans-serif;
    }
    .btn-ai:hover:not(:disabled) { opacity: .88; }
    .btn-ai:active:not(:disabled) { transform: scale(.98); }
    .btn-ai:disabled { opacity: .3; cursor: not-allowed; }

    .btn-reset {
      background: transparent; color: var(--text3);
      border: 1px solid var(--border); padding: 10px 20px; border-radius: 6px;
      font-size: .88rem; font-weight: 500; cursor: pointer;
      font-family: 'Inter', sans-serif;
    }
    .btn-reset:hover { color: var(--text2); border-color: var(--border2); }

    /* ── Progress ── */
    .ai-progress {
      margin: 20px 40px 0;
      background: var(--surface);
      border-radius: 8px;
      border: 1px solid var(--border);
      padding: 18px 22px;
      display: none;
    }
    .ai-progress .prog-title {
      font-size: .84rem; font-weight: 600; color: var(--teal);
      margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
    }
    .prog-steps { display: flex; flex-direction: column; gap: 8px; }
    .prog-step { display: flex; align-items: center; gap: 10px; font-size: .82rem; color: var(--text3); }
    .prog-step .step-icon {
      width: 18px; height: 18px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; font-size: .65rem;
      background: var(--surface3); color: var(--text3);
    }
    .prog-step.done   { color: var(--green); }
    .prog-step.done .step-icon   { background: var(--green-bg); color: var(--green); }
    .prog-step.active { color: var(--teal-mid); font-weight: 500; }
    .prog-step.active .step-icon { background: var(--teal-bg); color: var(--teal-mid); }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinning { animation: spin .8s linear infinite; display: inline-block; }

    /* ── Error ── */
    .error-banner {
      background: var(--red-bg); border: 1px solid rgba(239,68,68,.25);
      color: var(--red); padding: 11px 14px; border-radius: 6px;
      font-size: .84rem; margin: 12px 40px 0;
    }

    /* ── Results ── */
    .results { padding: 28px 40px 56px; }
    .results-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
    .results-header h2 { font-size: 1rem; font-weight: 600; color: var(--text); }

    .export-btn {
      background: var(--surface2); border: 1px solid var(--border2);
      padding: 7px 14px; border-radius: 6px; font-size: .8rem; font-weight: 500;
      cursor: pointer; display: flex; align-items: center; gap: 6px;
      color: var(--text2); transition: border-color .15s;
    }
    .export-btn:hover { border-color: var(--border2); color: var(--text); }

    .summary-row { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
    .chip {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 12px; border-radius: 4px;
      font-size: .78rem; font-weight: 600; font-family: var(--mono);
    }
    .chip.added   { background: var(--green-bg);  color: var(--green); border: 1px solid rgba(34,197,94,.2); }
    .chip.removed { background: var(--red-bg);    color: var(--red);   border: 1px solid rgba(239,68,68,.2); }
    .chip.matched { background: var(--surface2);  color: var(--text2); border: 1px solid var(--border); }
    .chip .dot { width: 6px; height: 6px; border-radius: 50%; }
    .chip.added .dot   { background: var(--green); }
    .chip.removed .dot { background: var(--red); }
    .chip.matched .dot { background: var(--text3); }

    .ai-insight {
      background: var(--teal-bg);
      border: 1px solid rgba(10,61,50,.15);
      border-radius: 8px; padding: 14px 16px; margin-bottom: 18px;
      font-size: .86rem; color: var(--text2); line-height: 1.65;
    }
    .ai-insight .insight-label {
      font-size: .68rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
      color: var(--teal); margin-bottom: 6px;
      display: flex; align-items: center; gap: 6px; font-family: var(--mono);
    }

    .legend { display: flex; gap: 14px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: .74rem; color: var(--text3); }
    .legend-swatch { width: 12px; height: 12px; border-radius: 2px; }
    .legend-swatch.added-s   { background: var(--green-bg); border: 1px solid rgba(34,197,94,.3); }
    .legend-swatch.removed-s { background: var(--red-bg);   border: 1px solid rgba(239,68,68,.3); }
    .legend-swatch.dr-s      { background: var(--green-bg); border: 1px solid rgba(34,197,94,.3); }
    .legend-swatch.cr-s      { background: var(--red-bg);   border: 1px solid rgba(239,68,68,.3); }

    /* ── Ledger ── */
    .ledger-wrap { border-radius: 8px; overflow: hidden; border: 1px solid var(--border); background: var(--surface); }

    .ledger-top-header { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface2); }
    .lth {
      padding: 10px 14px; font-size: .72rem; font-weight: 600;
      letter-spacing: .6px; text-transform: uppercase;
      display: flex; align-items: center; gap: 7px;
      color: var(--text2); font-family: var(--mono);
    }
    .lth:first-child { border-right: 1px solid var(--border); }

    .ledger-sub-header,
    .acct-row { display: grid; grid-template-columns: 80px 1fr 110px 110px 1px 80px 1fr 110px 110px; }

    .ledger-sub-header { background: var(--surface3); border-bottom: 1px solid var(--border); }
    .lsh { padding: 6px 10px; font-size: .65rem; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--text3); font-family: var(--mono); }
    .lsh.dr  { text-align: right; color: var(--green); }
    .lsh.cr  { text-align: right; color: var(--red); }
    .lsh.div { background: var(--border); }

    .cat-header { display: grid; grid-template-columns: 1fr 1px 1fr; background: var(--surface2); border-top: 1px solid var(--border); }
    .cat-label  { padding: 7px 14px; font-size: .65rem; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--teal); font-family: var(--mono); }
    .cat-div    { background: var(--border); }

    .acct-row { border-top: 1px solid var(--border); }
    .acct-row:hover .acct-num,
    .acct-row:hover .acct-name,
    .acct-row:hover .acct-dr,
    .acct-row:hover .acct-cr { background: var(--surface3) !important; }

    .acct-num  { padding: 8px 10px; font-size: .76rem; color: var(--text3); font-family: var(--mono); background: var(--surface); }
    .acct-name { padding: 8px 10px; font-size: .84rem; color: var(--text); display: flex; align-items: center; gap: 6px; background: var(--surface); }
    .acct-dr   { padding: 8px 10px; font-size: .8rem; color: var(--green); font-weight: 500; text-align: right; font-family: var(--mono); white-space: nowrap; background: var(--surface); }
    .acct-cr   { padding: 8px 10px; font-size: .8rem; color: var(--red); font-weight: 500; text-align: right; font-family: var(--mono); white-space: nowrap; background: var(--surface); }
    .acct-div  { background: var(--border); }

    .acct-row .curr-num.added-cell,
    .acct-row .curr-name.added-cell,
    .acct-row .curr-dr.added-cell,
    .acct-row .curr-cr.added-cell { background: var(--green-bg) !important; }
    .acct-row .curr-name.added-cell { color: var(--green); }

    .acct-row .prev-num.removed-cell,
    .acct-row .prev-name.removed-cell,
    .acct-row .prev-dr.removed-cell,
    .acct-row .prev-cr.removed-cell { background: var(--red-bg) !important; }
    .acct-row .prev-name.removed-cell { color: var(--red); }

    .empty-cell { background: var(--surface2) !important; color: transparent !important; }

    .acct-badge { font-size: .62rem; font-weight: 700; padding: 1px 5px; border-radius: 3px; flex-shrink: 0; text-transform: uppercase; letter-spacing: .3px; font-family: var(--mono); }
    .acct-badge.new { background: var(--green-bg); color: var(--green); border: 1px solid rgba(34,197,94,.25); }
    .acct-badge.del { background: var(--red-bg);   color: var(--red);   border: 1px solid rgba(239,68,68,.25); }

    /* ── Trial Balance Footer ── */
    .tb-footer {
      display: grid; grid-template-columns: 1fr 1px 1fr;
      border-top: 1px solid var(--border);
      background: var(--surface2);
    }
    .tb-side {
      padding: 14px 0;
      display: grid;
      grid-template-columns: 80px 1fr 110px 110px;
    }
    .tb-div { background: var(--border); }
    .tb-label {
      grid-column: 1 / 3; padding: 4px 14px;
      font-size: .76rem; font-weight: 500; color: var(--text2);
      display: flex; align-items: center; gap: 6px;
    }
    .tb-total-dr { padding: 4px 10px; font-size: .8rem; font-weight: 600; color: var(--green); text-align: right; font-family: var(--mono); }
    .tb-total-cr { padding: 4px 10px; font-size: .8rem; font-weight: 600; color: var(--red);   text-align: right; font-family: var(--mono); }
    .tb-status {
      grid-column: 1 / 5; margin: 8px 14px 6px;
      padding: 7px 12px; border-radius: 5px;
      font-size: .8rem; font-weight: 600;
      display: flex; align-items: center; gap: 7px; font-family: var(--mono);
    }
    .tb-status.ok  { background: var(--green-bg); color: var(--green); border: 1px solid rgba(34,197,94,.2); }
    .tb-status.err { background: var(--red-bg);   color: var(--red);   border: 1px solid rgba(239,68,68,.2); }

    /* ── Account changes summary ── */
    .changes-summary {
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
      margin-top: 16px;
    }
    @media (max-width: 700px) { .changes-summary { grid-template-columns: 1fr; } }
    .changes-col {
      background: var(--surface); border-radius: 8px; border: 1px solid var(--border);
      overflow: hidden;
    }
    .changes-col-head {
      display: flex; align-items: center; gap: 7px;
      padding: 10px 14px; font-size: .76rem; font-weight: 700;
      letter-spacing: .8px; text-transform: uppercase; font-family: var(--mono);
    }
    .changes-col.added-col   .changes-col-head { background: var(--green-bg); color: var(--green); }
    .changes-col.removed-col .changes-col-head { background: var(--red-bg);   color: var(--red); }
    .changes-list { list-style: none; }
    .changes-list li {
      padding: 7px 14px; font-size: .82rem; color: var(--text);
      border-top: 1px solid var(--border);
      display: flex; align-items: baseline; gap: 8px;
    }
    .changes-list li .ch-num { font-family: var(--mono); font-size: .72rem; color: var(--text3); min-width: 44px; }
    .changes-empty { padding: 14px; font-size: .8rem; color: var(--text3); font-style: italic; }

    .stats-summary { margin-top: 16px; }
    .stats-title {
      font-size: .76rem; font-weight: 700; letter-spacing: .8px; text-transform: uppercase;
      font-family: var(--mono); color: var(--text3); margin-bottom: 10px;
    }
    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px;
    }
    .stat-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      padding: 12px 14px;
    }
    .stat-name { font-size: .78rem; color: var(--text3); margin-bottom: 6px; }
    .stat-amounts { font-family: var(--mono); font-size: .82rem; color: var(--text); margin-bottom: 6px; }
    .stat-pct { font-size: .9rem; font-weight: 700; }
    .stat-pct.up   { color: var(--green); }
    .stat-pct.down { color: var(--red); }
    .stat-pct.flat { color: var(--text3); }

    .prog-elapsed { margin-top: 10px; font-size: .76rem; color: var(--text3); font-family: var(--mono); }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 1200px) {
      .ledger-sub-header, .acct-row { grid-template-columns: 70px 1fr 95px 95px 1px 70px 1fr 95px 95px; }
      .tb-side { grid-template-columns: 70px 1fr 95px 95px; }
    }
    @media (max-width: 960px) {
      .ledger-sub-header, .acct-row { grid-template-columns: 55px 1fr 80px 80px 1px 55px 1fr 80px 80px; }
      .tb-side { grid-template-columns: 55px 1fr 80px 80px; }
    }
    @media (max-width: 700px) {
      .upload-row  { grid-template-columns: 1fr; padding: 16px; }
      .actions     { padding: 16px; }
      .results     { padding: 16px 16px 40px; }
      header       { padding: 0 16px; }
      .ai-progress, .error-banner { margin-left: 16px; margin-right: 16px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo-mark">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4">
      <path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2V9M9 21H5a2 2 0 0 1-2-2V9m0 0h18"/>
    </svg>
  </div>
  <h1>Reconcile Tool</h1>
  <span class="sep">|</span>
  <span class="sub">SST Accountants &amp; Consultants</span>
  <span class="badge">Financial</span>
  <span class="ai-badge">AI</span>
</header>

<div id="error-container"></div>

<div class="upload-row">
  <div class="upload-card" id="card-prev" ondragover="handleDragOver(event,'prev')" ondragleave="handleDragLeave('prev')" ondrop="handleDrop(event,'prev')">
    <div class="year-label">Left / Prior Period</div>
    <h2>Previous Year</h2>
    <input type="file" id="file-prev" accept=".csv,.xlsx,.xls" onchange="handleFile(event,'prev')" />
    <div class="drop-zone" id="drop-prev" onclick="document.getElementById('file-prev').click()">
      <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      <p>Drop your file here or <strong>browse</strong></p>
      <span class="file-types">CSV · XLSX · XLS</span>
    </div>
    <div id="info-prev" style="display:none"></div>
  </div>

  <div class="upload-card" id="card-curr" ondragover="handleDragOver(event,'curr')" ondragleave="handleDragLeave('curr')" ondrop="handleDrop(event,'curr')">
    <div class="year-label">Right / Current Period</div>
    <h2>Current Year</h2>
    <input type="file" id="file-curr" accept=".csv,.xlsx,.xls" onchange="handleFile(event,'curr')" />
    <div class="drop-zone" id="drop-curr" onclick="document.getElementById('file-curr').click()">
      <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      <p>Drop your file here or <strong>browse</strong></p>
      <span class="file-types">CSV · XLSX · XLS</span>
    </div>
    <div id="info-curr" style="display:none"></div>
  </div>
</div>

<div class="actions">
  <button class="btn-ai" id="btn-ai" onclick="runWithAI()" disabled>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
      <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
    </svg>
    Run with AI
  </button>
  <button class="btn-reset" onclick="resetAll()">Reset</button>
</div>

<div class="ai-progress" id="ai-progress">
  <div class="prog-title"><span class="spinning">✦</span> AI is analyzing your data…</div>
  <div class="prog-steps" id="prog-steps"></div>
  <div class="prog-elapsed" id="prog-elapsed"></div>
</div>

<div class="results" id="results" style="display:none"></div>

<script>
  const state = {
    prev: { rows: null, headers: [], cols: null, fileName: '' },
    curr: { rows: null, headers: [], cols: null, fileName: '' }
  };

  /* ── Column auto-detection ──────────────────────────────────────── */

  function detectCols(headers) {
    const h = headers.map(x => x.toLowerCase());

    function find(kws) {
      for (const kw of kws) {
        const i = h.findIndex(x => x.includes(kw));
        if (i !== -1) return i;
      }
      return -1;
    }

    const numIdx  = find(['gl code','gl #','acct #','account #','account no','acct no','acct number','account number','gl','code','num']);
    const nameIdx = find(['account name','account desc','description','account','name','desc']);
    const drIdx   = find(['debit','dr ','dr$',' dr']);
    const crIdx   = find(['credit','cr ','cr$',' cr']);
    const balIdx  = find(['balance','amount','total','ytd','net']);

    return {
      num:  numIdx  >= 0 ? numIdx  : -1,
      name: nameIdx >= 0 ? nameIdx : 0,   // fallback to first col
      dr:   drIdx   >= 0 ? drIdx   : -1,
      cr:   crIdx   >= 0 ? crIdx   : -1,
      bal:  balIdx  >= 0 ? balIdx  : -1,
    };
  }

  /* ── File handling ─────────────────────────────────────────────── */

  function showError(msg) {
    document.getElementById('error-container').innerHTML = `<div class="error-banner">${msg}</div>`;
    setTimeout(() => document.getElementById('error-container').innerHTML = '', 7000);
  }

  function handleDragOver(e, s) { e.preventDefault(); document.getElementById('card-'+s).classList.add('dragover'); }
  function handleDragLeave(s)   { document.getElementById('card-'+s).classList.remove('dragover'); }
  function handleDrop(e, s)     { e.preventDefault(); handleDragLeave(s); const f = e.dataTransfer.files[0]; if (f) processFile(f, s); }
  function handleFile(e, s)     { const f = e.target.files[0]; if (f) processFile(f, s); }

  function processFile(file, side) {
    const ext = file.name.split('.').pop().toLowerCase();
    if (!['csv','xlsx','xls'].includes(ext)) { showError('Unsupported file type — use CSV, XLSX, or XLS.'); return; }
    const reader = new FileReader();
    reader.onload = e => {
      try {
        let rows;
        if (ext === 'csv') { rows = parseCSV(e.target.result); }
        else {
          const wb = XLSX.read(e.target.result, { type: 'array' });
          rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '' });
        }
        rows = rows.filter(r => r.some(c => String(c).trim() !== ''));
        if (rows.length < 2) { showError('File appears empty.'); return; }
        const headers = rows[0].map(h => String(h).trim());
        const cols = detectCols(headers);
        state[side] = { rows: rows.slice(1), headers, cols, fileName: file.name };
        renderFileInfo(side, file.name, rows.length - 1, headers, cols);
        checkReady();
      } catch(err) { showError('Could not parse file: ' + err.message); }
    };
    if (ext === 'csv') reader.readAsText(file); else reader.readAsArrayBuffer(file);
  }

  function parseCSV(text) {
    return text.trim().split('\n').map(line => {
      const cols=[]; let cur=''; let inQ=false;
      for (const ch of line) {
        if (ch==='"') inQ=!inQ;
        else if (ch===',' && !inQ) { cols.push(cur.trim()); cur=''; }
        else cur+=ch;
      }
      cols.push(cur.trim()); return cols;
    });
  }

  function renderFileInfo(side, name, count, headers, cols) {
    const el = document.getElementById('info-'+side);
    el.style.display = 'block';

    const pills = [];
    if (cols.num  >= 0) pills.push(`# → ${headers[cols.num]}`);
    pills.push(`Name → ${headers[cols.name]}`);
    if (cols.dr   >= 0) pills.push(`Debit → ${headers[cols.dr]}`);
    if (cols.cr   >= 0) pills.push(`Credit → ${headers[cols.cr]}`);
    if (cols.bal  >= 0 && cols.dr < 0) pills.push(`Balance → ${headers[cols.bal]}`);

    el.innerHTML = `
      <div class="file-info">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        <div><div class="fname">${escHtml(name)}</div><div class="fmeta">${count.toLocaleString()} rows detected</div></div>
        <button class="clear-btn" onclick="clearSide('${side}')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="detected-cols">${pills.map(p=>`<span class="col-pill">${escHtml(p)}</span>`).join('')}</div>`;

    document.getElementById('drop-'+side).style.display = 'none';
    document.getElementById('card-'+side).classList.add('loaded');
  }

  function clearSide(side) {
    state[side] = { rows:null, headers:[], cols:null, fileName:'' };
    document.getElementById('info-'+side).style.display = 'none';
    document.getElementById('drop-'+side).style.display = 'flex';
    document.getElementById('card-'+side).classList.remove('loaded');
    document.getElementById('file-'+side).value = '';
    checkReady();
    document.getElementById('results').style.display = 'none';
  }

  function checkReady() {
    const ok = state.prev.rows && state.curr.rows;
    document.getElementById('btn-ai').disabled = !ok;
  }

  /* ── Extract rows ───────────────────────────────────────────────── */

  function extractRows(side) {
    const { rows, cols } = state[side];
    const seen = new Set();
    const out  = [];

    for (const r of rows) {
      const name = String(r[cols.name] ?? '').trim();
      if (!name) continue;
      const key = name.toLowerCase();
      if (seen.has(key)) continue;
      seen.add(key);

      let dr = '', cr = '';

      if (cols.dr >= 0 || cols.cr >= 0) {
        // File has explicit debit/credit columns
        let rawDr = parseNum(r[cols.dr]);
        let rawCr = parseNum(r[cols.cr]);
        // Normalize sign anomalies — a negative value in one column is a contra
        // entry that belongs in the other column (debits/credits are magnitudes).
        if (rawDr < 0) { rawCr += -rawDr; rawDr = 0; }
        if (rawCr < 0) { rawDr += -rawCr; rawCr = 0; }
        dr = rawDr !== 0 ? rawDr : '';
        cr = rawCr !== 0 ? rawCr : '';
      } else if (cols.bal >= 0) {
        // Single balance column — positive = debit, negative = credit
        const bal = parseNum(r[cols.bal]);
        if (bal > 0)      dr = bal;
        else if (bal < 0) cr = Math.abs(bal);
      }

      out.push({
        num:  cols.num >= 0 ? String(r[cols.num] ?? '').trim() : '',
        name,
        dr,
        cr,
      });
    }
    return out;
  }

  function parseNum(v) {
    if (v === '' || v === null || v === undefined) return 0;
    // Keep digits, decimal points, sign, and scientific-notation markers (e/E/+)
    // so values like "1.5e10" or "(1,234.56)" parse correctly rather than being mangled.
    let s = String(v).trim();
    const isParenNegative = /^\(.*\)$/.test(s);
    s = s.replace(/[^0-9.\-eE+]/g, '');
    let n = parseFloat(s);
    if (isNaN(n)) return 0;
    if (isParenNegative) n = -Math.abs(n);
    return n;
  }

  function fmtAmt(v) {
    if (v === '' || v === null || v === undefined || v === 0) return '';
    const n = typeof v === 'number' ? v : parseNum(v);
    if (n === 0) return '';
    return Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function fmtFull(v) {
    const n = typeof v === 'number' ? v : parseNum(v);
    return n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function trialBalance(rows) {
    let totalDr = 0, totalCr = 0;
    for (const r of rows) {
      totalDr += typeof r.dr === 'number' ? r.dr : parseNum(r.dr);
      totalCr += typeof r.cr === 'number' ? r.cr : parseNum(r.cr);
    }
    const diff      = Math.abs(totalDr - totalCr);
    const balanced  = diff < 0.005;
    return { totalDr, totalCr, diff, balanced };
  }

  /* ── AI run ─────────────────────────────────────────────────────── */

  const STEPS = [
    { id:'extract', label:'Reading and parsing both files' },
    { id:'analyze', label:'AI categorizing, cleaning and aligning accounts' },
    { id:'insight', label:'AI generating financial insights' },
  ];

  function setStep(id) {
    document.getElementById('prog-steps').innerHTML = STEPS.map(s => {
      const di=STEPS.findIndex(x=>x.id===id), ti=STEPS.findIndex(x=>x.id===s.id);
      const cls=ti<di?'done':s.id===id?'active':'';
      const icon=ti<di?'✓':s.id===id?'<span class="spinning">↻</span>':'○';
      return `<div class="prog-step ${cls}"><div class="step-icon">${icon}</div><span>${s.label}</span></div>`;
    }).join('');
  }

  // Calls our own server-side proxy at /api/claude — the Anthropic API key lives
  // only on the server and is never exposed to the browser.
  async function callClaude(prompt, maxTokens=8192, { timeoutMs=240000, retries=1 } = {}) {
    let lastErr;
    for (let attempt = 0; attempt <= retries; attempt++) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const res = await fetch('/api/claude', {
          method:'POST',
          signal: controller.signal,
          headers: { 'content-type':'application/json' },
          body: JSON.stringify({ prompt, maxTokens })
        });
        clearTimeout(timer);

        const data = await res.json().catch(()=>({}));

        if (!res.ok) {
          const msg = res.status === 413
            ? 'These files are too large to reconcile in a single AI run. Try splitting them into smaller batches (e.g. by account range or category) and running each separately.'
            : (data.error || `Server error (${res.status})`);
          // Retry on rate limit / transient server errors only
          if ((res.status === 429 || res.status >= 500) && attempt < retries) {
            lastErr = new Error(msg);
            await sleep(1000 * (attempt + 1));
            continue;
          }
          throw new Error(msg);
        }

        if (!data.text) throw new Error('AI returned an empty response.');
        return data.text;

      } catch (err) {
        clearTimeout(timer);
        if (err.name === 'AbortError') {
          lastErr = new Error('The AI took too long to respond (large ledgers can take a few minutes to categorize). Please try again — if it keeps timing out, try splitting the files into smaller batches.');
        } else {
          lastErr = err;
        }
        if (attempt < retries && (err.name === 'AbortError' || err instanceof TypeError)) {
          await sleep(1000 * (attempt + 1));
          continue;
        }
        throw lastErr;
      }
    }
    throw lastErr;
  }

  async function runWithAI() {
    const prevRows = extractRows('prev');
    const currRows = extractRows('curr');

    const progEl = document.getElementById('ai-progress');
    const elapsedEl = document.getElementById('prog-elapsed');
    progEl.style.display = 'block';
    document.getElementById('results').style.display = 'none';
    document.getElementById('btn-ai').disabled = true;

    const startedAt = Date.now();
    const elapsedTimer = setInterval(() => {
      const secs = Math.floor((Date.now() - startedAt) / 1000);
      const mins = Math.floor(secs / 60);
      const rem = secs % 60;
      const timeStr = mins > 0 ? `${mins}m ${rem}s` : `${secs}s`;
      const note = secs > 60 ? ' — large ledgers can take a few minutes, hang tight' : '';
      elapsedEl.textContent = `Elapsed: ${timeStr}${note}`;
    }, 1000);

    try {
      setStep('extract');
      await sleep(200);

      setStep('analyze');

      const fmtList = rows => rows.map(r =>
        [r.num, r.name,
         r.dr !== '' ? `DR:${r.dr}` : '',
         r.cr !== '' ? `CR:${r.cr}` : '']
        .filter(Boolean).join(' | ')
      ).join('\n');

      const prompt = `You are a financial data analyst performing a year-over-year account reconciliation.

Each account entry: [Account# | ] Account Name [ | DR:debit] [ | CR:credit]

Tasks:
1. Clean account names (fix caps/spacing, expand abbreviations: A/R→Accounts Receivable, PP&E→Property Plant & Equipment).
2. Group all accounts from BOTH years into: Assets, Liabilities, Equity, Revenue, Cost of Revenue, Operating Expenses, Other Income/Expense.
3. Sort within each category by account number if present, else standard financial order.
4. Match accounts that appear in both years (fuzzy name match OK — use the cleaner name).
5. Layout: matched accounts on same row. Removed (prev only) at bottom of category. Added (curr only) at bottom of category.

Return ONLY raw JSON, no markdown:
{"categories":[{"name":"Category","rows":[{"status":"matched|added|removed","prev":{"num":"1000","name":"Cash","dr":50000,"cr":0},"curr":{"num":"1000","name":"Cash","dr":72000,"cr":0}}]}]}

- prev is null when status="added", curr is null when status="removed"
- dr and cr are numbers (0 if empty)
- Include every account

PREVIOUS YEAR:
${fmtList(prevRows)}

CURRENT YEAR:
${fmtList(currRows)}`;

      const raw = await callClaude(prompt, 16000);
      let parsed;
      try {
        parsed = parseAIJson(raw);
      } catch(e) {
        console.error('AI categorization — raw response that failed to parse:', raw);
        const trimmed = raw.trim();
        const looksTruncated = !trimmed.endsWith('}') && !trimmed.endsWith('```');
        throw new Error(looksTruncated
          ? 'The AI response was too large and got cut off. Try reconciling smaller files or fewer accounts at a time.'
          : 'AI returned an unexpected format. Please try again — if this keeps happening, try smaller files.');
      }

      const categories = parsed.categories || [];
      const added   = categories.flatMap(c=>c.rows.filter(r=>r.status==='added').map(r=>r.curr?.name).filter(Boolean));
      const removed = categories.flatMap(c=>c.rows.filter(r=>r.status==='removed').map(r=>r.prev?.name).filter(Boolean));
      const matchedCount = categories.flatMap(c=>c.rows.filter(r=>r.status==='matched')).length;

      setStep('insight');
      let insight = '';
      if (added.length > 0 || removed.length > 0) {
        try {
          insight = await callClaude(
            `Financial analyst: summarize in 2-3 professional sentences what these year-over-year account changes suggest about the business. No bullets.
Added: ${added.slice(0,20).join(', ')}${added.length>20?'…':''}
Removed: ${removed.slice(0,20).join(', ')}${removed.length>20?'…':''}
Matched: ${matchedCount}`, 512);
        } catch (e) {
          // Insight is a nice-to-have; don't fail the whole reconciliation if it errors.
          insight = '';
        }
      }

      progEl.style.display = 'none';
      renderResults({ categories, added, removed, matchedCount,
        prevFile: state.prev.fileName, currFile: state.curr.fileName,
        prevTB: trialBalance(prevRows), currTB: trialBalance(currRows),
        aiInsight: insight });

    } catch(err) {
      progEl.style.display = 'none';
      showError('AI error: ' + err.message);
    } finally {
      clearInterval(elapsedTimer);
      elapsedEl.textContent = '';
      checkReady();
    }
  }

  function sleep(ms) { return new Promise(r=>setTimeout(r,ms)); }

  // Robustly extract JSON from an LLM response that may include markdown fences
  // and/or stray prose before/after the JSON object.
  function parseAIJson(raw) {
    const attempts = [];

    // 1) Strip a leading/trailing markdown code fence, if present
    attempts.push(raw.replace(/^```[a-z]*\n?/i, '').replace(/\n?```\s*$/i, '').trim());

    // 2) Slice from the first '{' to the last '}' (handles stray prose around the JSON)
    const start = raw.indexOf('{');
    const end = raw.lastIndexOf('}');
    if (start !== -1 && end !== -1 && end > start) {
      attempts.push(raw.slice(start, end + 1).trim());
    }

    // 3) Raw text as-is
    attempts.push(raw.trim());

    for (const candidate of attempts) {
      try { return JSON.parse(candidate); } catch (_) { /* try next */ }
    }
    throw new Error('Could not parse JSON from AI response');
  }

  /* ── Render ─────────────────────────────────────────────────────── */

  function tbSideHTML(tb) {
    const statusCls  = tb.balanced ? 'ok' : 'err';
    const statusIcon = tb.balanced ? '✓' : '✕';
    const statusText = tb.balanced
      ? 'Balanced'
      : `Out of balance by ${fmtFull(tb.diff)}`;
    return `
      <div class="tb-side">
        <div class="tb-label">Total Debits</div>
        <div class="tb-total-dr">${fmtFull(tb.totalDr)}</div>
        <div class="tb-total-cr"></div>
        <div class="tb-label">Total Credits</div>
        <div class="tb-total-dr"></div>
        <div class="tb-total-cr">${fmtFull(tb.totalCr)}</div>
        <div class="tb-status ${statusCls}">${statusIcon} ${statusText}</div>
      </div>`;
  }

  function changesListHTML(entries, emptyMsg) {
    if (!entries.length) return `<div class="changes-empty">${emptyMsg}</div>`;
    return `<ul class="changes-list">${entries.map(e => `
      <li>
        ${e.num ? `<span class="ch-num">${escHtml(e.num)}</span>` : ''}
        <span>${escHtml(e.name)}${e.category ? ` <span style="color:var(--text3);">— ${escHtml(e.category)}</span>` : ''}</span>
      </li>`).join('')}</ul>`;
  }

  function changesSummaryHTML(categories) {
    const added = [], removed = [];
    for (const cat of categories) {
      for (const row of cat.rows) {
        if (row.status === 'added' && row.curr) added.push({ num: row.curr.num, name: row.curr.name, category: cat.name });
        if (row.status === 'removed' && row.prev) removed.push({ num: row.prev.num, name: row.prev.name, category: cat.name });
      }
    }
    return `
      <div class="changes-summary">
        <div class="changes-col added-col">
          <div class="changes-col-head">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Added in Current Year (${added.length})
          </div>
          ${changesListHTML(added, 'No new accounts in the current year.')}
        </div>
        <div class="changes-col removed-col">
          <div class="changes-col-head">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Removed from Prior Year (${removed.length})
          </div>
          ${changesListHTML(removed, 'No accounts were removed from the prior year.')}
        </div>
      </div>`;
  }

  function statsSummaryHTML(categories) {
    const rows = categories.map(cat => {
      let prevTotal = 0, currTotal = 0;
      for (const row of cat.rows) {
        if (row.prev) prevTotal += (row.prev.dr || 0) + (row.prev.cr || 0);
        if (row.curr) currTotal += (row.curr.dr || 0) + (row.curr.cr || 0);
      }
      return { name: cat.name, prevTotal, currTotal };
    }).filter(r => r.prevTotal > 0 || r.currTotal > 0);

    if (!rows.length) return '';

    const cards = rows.map(r => {
      let pct, cls, arrow;
      if (r.prevTotal === 0) {
        pct = r.currTotal === 0 ? 0 : 100;
        cls = r.currTotal === 0 ? 'flat' : 'up';
        arrow = r.currTotal === 0 ? '→' : '▲';
      } else {
        pct = ((r.currTotal - r.prevTotal) / r.prevTotal) * 100;
        cls = Math.abs(pct) < 0.05 ? 'flat' : (pct > 0 ? 'up' : 'down');
        arrow = cls === 'flat' ? '→' : (cls === 'up' ? '▲' : '▼');
      }
      const pctStr = `${cls === 'up' ? '+' : ''}${pct.toFixed(1)}%`;
      return `
        <div class="stat-card">
          <div class="stat-name">${escHtml(r.name)}</div>
          <div class="stat-amounts">${fmtAmt(r.prevTotal)} &rarr; ${fmtAmt(r.currTotal)}</div>
          <div class="stat-pct ${cls}">${arrow} ${pctStr}</div>
        </div>`;
    }).join('');

    return `
      <div class="stats-summary">
        <div class="stats-title">Year-over-Year Change by Category</div>
        <div class="stats-grid">${cards}</div>
      </div>`;
  }

  function renderResults({ categories, added, removed, matchedCount, prevFile, currFile, prevTB, currTB, aiInsight }) {
    const el = document.getElementById('results');
    el.style.display = 'block';

    const insightHTML = aiInsight ? `
      <div class="ai-insight">
        <div class="insight-label">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
          </svg>AI Insight
        </div>${escHtml(aiInsight)}
      </div>` : '';

    let ledgerHTML = '';
    for (const cat of categories) {
      ledgerHTML += `
        <div class="cat-header">
          <div class="cat-label">${escHtml(cat.name)}</div>
          <div class="cat-div"></div>
          <div class="cat-label"></div>
        </div>`;

      for (const row of cat.rows) {
        const isAdded   = row.status === 'added';
        const isRemoved = row.status === 'removed';

        const pCls = isRemoved ? 'removed-cell' : '';
        const cCls = isAdded   ? 'added-cell'   : '';

        const p = row.prev;
        const c = row.curr;

        const prevBadge = isRemoved ? '<span class="acct-badge del">Removed</span>' : '';
        const currBadge = isAdded   ? '<span class="acct-badge new">New</span>'     : '';

        const pDr = p ? fmtAmt(p.dr) : '';
        const pCr = p ? fmtAmt(p.cr) : '';
        const cDr = c ? fmtAmt(c.dr) : '';
        const cCr = c ? fmtAmt(c.cr) : '';

        ledgerHTML += `<div class="acct-row">
          <div class="acct-num prev-num ${pCls}${!p?' empty-cell':''}">${p ? escHtml(p.num||'') : ''}</div>
          <div class="acct-name prev-name ${pCls}${!p?' empty-cell':''}">${p ? prevBadge+escHtml(p.name||'') : ''}</div>
          <div class="acct-dr prev-dr ${pCls}${!p?' empty-cell':''}">${pDr}</div>
          <div class="acct-cr prev-cr ${pCls}${!p?' empty-cell':''}">${pCr}</div>
          <div class="acct-div"></div>
          <div class="acct-num curr-num ${cCls}${!c?' empty-cell':''}">${c ? escHtml(c.num||'') : ''}</div>
          <div class="acct-name curr-name ${cCls}${!c?' empty-cell':''}">${c ? currBadge+escHtml(c.name||'') : ''}</div>
          <div class="acct-dr curr-dr ${cCls}${!c?' empty-cell':''}">${cDr}</div>
          <div class="acct-cr curr-cr ${cCls}${!c?' empty-cell':''}">${cCr}</div>
        </div>`;
      }
    }

    el.innerHTML = `
      <div class="results-header">
        <h2>Reconciliation Results</h2>
        <button class="export-btn" onclick="exportResults(${JSON.stringify(added)}, ${JSON.stringify(removed)})">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
          </svg>Export CSV
        </button>
      </div>

      <div class="summary-row">
        <div class="chip added"><div class="dot"></div>${added.length} Added</div>
        <div class="chip removed"><div class="dot"></div>${removed.length} Removed</div>
        <div class="chip matched"><div class="dot"></div>${matchedCount} Matched</div>
      </div>

      ${insightHTML}

      <div class="legend">
        <div class="legend-item"><div class="legend-swatch dr-s"></div>Debit (positive)</div>
        <div class="legend-item"><div class="legend-swatch cr-s"></div>Credit (negative)</div>
        <div class="legend-item"><div class="legend-swatch added-s"></div>New account</div>
        <div class="legend-item"><div class="legend-swatch removed-s"></div>Removed account</div>
      </div>

      <div class="ledger-wrap">
        <div class="ledger-top-header">
          <div class="lth">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            Previous Year &mdash; ${escHtml(prevFile)}
          </div>
          <div class="lth">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            Current Year &mdash; ${escHtml(currFile)}
          </div>
        </div>
        <div class="ledger-sub-header">
          <div class="lsh">Acct #</div>
          <div class="lsh">Account Name</div>
          <div class="lsh dr">Debit</div>
          <div class="lsh cr">Credit</div>
          <div class="lsh div"></div>
          <div class="lsh">Acct #</div>
          <div class="lsh">Account Name</div>
          <div class="lsh dr">Debit</div>
          <div class="lsh cr">Credit</div>
        </div>
        ${ledgerHTML}
        <div class="tb-footer">
          ${tbSideHTML(prevTB)}
          <div class="tb-div"></div>
          ${tbSideHTML(currTB)}
        </div>
      </div>

      ${changesSummaryHTML(categories)}

      ${statsSummaryHTML(categories)}`;

    el.scrollIntoView({ behavior:'smooth', block:'start' });
  }

  /* ── Export ─────────────────────────────────────────────────────── */

  function exportResults(added, removed) {
    const rows = [['Status','Account Name']];
    added.forEach(a => rows.push(['Added', a]));
    removed.forEach(a => rows.push(['Removed', a]));
    const csv = rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob([csv],{type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url; a.download='reconciliation_results.csv'; a.click();
    URL.revokeObjectURL(url);
  }

  function resetAll() {
    clearSide('prev'); clearSide('curr');
    document.getElementById('results').style.display = 'none';
    document.getElementById('ai-progress').style.display = 'none';
    document.getElementById('error-container').innerHTML = '';
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
</body>
</html>
