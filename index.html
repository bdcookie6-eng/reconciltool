<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reconcile Tool</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; color: #1a1a2e; min-height: 100vh; }

    header { background: #1a1a2e; color: #fff; padding: 20px 40px; display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 1.4rem; font-weight: 600; letter-spacing: .5px; }
    .badge    { background: #4f8ef7; color: #fff; font-size: .7rem; padding: 2px 8px; border-radius: 20px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
    .ai-badge { background: linear-gradient(135deg,#7c3aed,#4f8ef7); color: #fff; font-size: .7rem; padding: 2px 8px; border-radius: 20px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }

    /* Upload panels */
    .upload-row { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; padding: 28px 40px 0; }

    .upload-card {
      background: #fff; border-radius: 12px; padding: 28px;
      border: 2px dashed #d0d7e3;
      transition: border-color .2s, box-shadow .2s;
      cursor: pointer;
    }
    .upload-card.dragover { border-color: #4f8ef7; box-shadow: 0 0 0 4px rgba(79,142,247,.12); }
    .upload-card.loaded   { border-style: solid; border-color: #22c55e; cursor: default; }
    .upload-card .year-label { font-size: .72rem; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: #6b7280; margin-bottom: 8px; }
    .upload-card h2 { font-size: 1.05rem; font-weight: 600; margin-bottom: 18px; color: #1a1a2e; }

    .drop-zone { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 36px 20px; border-radius: 8px; background: #f8fafc; }
    .drop-zone svg { color: #9ca3af; }
    .drop-zone p { font-size: .9rem; color: #6b7280; text-align: center; }
    .drop-zone p strong { color: #4f8ef7; cursor: pointer; }
    .drop-zone .file-types { font-size: .75rem; color: #9ca3af; }
    input[type="file"] { display: none; }

    .file-info { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: #f0fdf4; border-radius: 8px; margin-top: 4px; }
    .file-info svg { color: #22c55e; flex-shrink: 0; }
    .file-info .fname { font-size: .85rem; font-weight: 500; color: #166534; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-info .fmeta { font-size: .75rem; color: #6b7280; }
    .clear-btn { margin-left: auto; background: none; border: none; cursor: pointer; color: #9ca3af; padding: 4px; border-radius: 4px; display: flex; align-items: center; flex-shrink: 0; }
    .clear-btn:hover { color: #ef4444; background: #fee2e2; }

    /* Detected columns pill strip */
    .detected-cols { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
    .col-pill { font-size: .7rem; font-weight: 600; padding: 3px 8px; border-radius: 20px; background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
    .col-pill.warn { background: #fffbeb; color: #92400e; border-color: #fde68a; }

    /* Actions */
    .actions { display: flex; justify-content: center; padding: 24px 40px 0; gap: 12px; flex-wrap: wrap; }
    .btn-ai { background: linear-gradient(135deg,#7c3aed,#4f8ef7); color: #fff; border: none; padding: 13px 36px; border-radius: 8px; font-size: .95rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: opacity .2s, transform .1s; }
    .btn-ai:hover:not(:disabled) { opacity: .9; } .btn-ai:active:not(:disabled) { transform: scale(.98); } .btn-ai:disabled { opacity: .35; cursor: not-allowed; }
    .btn-reconcile { background: #1a1a2e; color: #fff; border: none; padding: 13px 36px; border-radius: 8px; font-size: .95rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: background .2s, transform .1s; }
    .btn-reconcile:hover:not(:disabled) { background: #2d2d50; } .btn-reconcile:active:not(:disabled) { transform: scale(.98); } .btn-reconcile:disabled { opacity: .4; cursor: not-allowed; }
    .btn-reset { background: #fff; color: #6b7280; border: 1px solid #d1d5db; padding: 13px 24px; border-radius: 8px; font-size: .95rem; font-weight: 500; cursor: pointer; }
    .btn-reset:hover { background: #f9fafb; color: #1a1a2e; }

    /* Progress */
    .ai-progress { margin: 20px 40px 0; background: #fff; border-radius: 10px; border: 1px solid #ede9fe; padding: 18px 24px; display: none; }
    .ai-progress .prog-title { font-size: .88rem; font-weight: 600; color: #7c3aed; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .prog-steps { display: flex; flex-direction: column; gap: 8px; }
    .prog-step { display: flex; align-items: center; gap: 10px; font-size: .84rem; color: #6b7280; }
    .prog-step .step-icon { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: .7rem; background: #f3f4f6; }
    .prog-step.done   { color: #16a34a; } .prog-step.done .step-icon   { background: #dcfce7; color: #16a34a; }
    .prog-step.active { color: #7c3aed; font-weight: 500; } .prog-step.active .step-icon { background: #ede9fe; color: #7c3aed; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinning { animation: spin .8s linear infinite; display: inline-block; }

    .error-banner { background: #fef2f2; border: 1px solid #fca5a5; color: #991b1b; padding: 12px 16px; border-radius: 8px; font-size: .88rem; margin: 12px 40px 0; }

    /* Results */
    .results { padding: 28px 40px 48px; }
    .results-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
    .results-header h2 { font-size: 1.1rem; font-weight: 700; }
    .export-btn { background: #fff; border: 1px solid #d1d5db; padding: 8px 14px; border-radius: 6px; font-size: .82rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; color: #374151; }
    .export-btn:hover { background: #f3f4f6; }

    .summary-row { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .chip { display: flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 8px; font-size: .84rem; font-weight: 600; }
    .chip.added   { background: #dcfce7; color: #166534; } .chip.added .dot   { background: #22c55e; }
    .chip.removed { background: #fee2e2; color: #991b1b; } .chip.removed .dot { background: #ef4444; }
    .chip.matched { background: #eff6ff; color: #1e40af; } .chip.matched .dot { background: #4f8ef7; }
    .chip .dot { width: 7px; height: 7px; border-radius: 50%; }

    .ai-insight { background: linear-gradient(135deg,#faf5ff,#eff6ff); border: 1px solid #ddd6fe; border-radius: 10px; padding: 14px 18px; margin-bottom: 20px; font-size: .88rem; color: #3730a3; line-height: 1.6; }
    .ai-insight .insight-label { font-size: .72rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #7c3aed; margin-bottom: 5px; display: flex; align-items: center; gap: 6px; }

    .legend { display: flex; gap: 16px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: .78rem; color: #6b7280; }
    .legend-swatch { width: 14px; height: 14px; border-radius: 3px; }
    .legend-swatch.added-s   { background: rgba(34,197,94,.2);  border: 1px solid #86efac; }
    .legend-swatch.removed-s { background: rgba(239,68,68,.15); border: 1px solid #fca5a5; }
    .legend-swatch.dr-s      { background: #dcfce7; border: 1px solid #86efac; }
    .legend-swatch.cr-s      { background: #fee2e2; border: 1px solid #fca5a5; }

    /* ── Ledger ── */
    .ledger-wrap { border-radius: 10px; overflow: hidden; border: 1px solid #e5e7eb; background: #fff; }

    .ledger-top-header { display: grid; grid-template-columns: 1fr 1fr; background: #1a1a2e; color: #fff; }
    .lth { padding: 11px 14px; font-size: .75rem; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; display: flex; align-items: center; gap: 7px; }
    .lth:first-child { border-right: 1px solid rgba(255,255,255,.12); }

    /* 9-col grid: num | name | dr | cr | divider | num | name | dr | cr */
    .ledger-sub-header,
    .acct-row { display: grid; grid-template-columns: 80px 1fr 110px 110px 2px 80px 1fr 110px 110px; }

    .ledger-sub-header { background: #f1f5f9; border-bottom: 2px solid #e2e8f0; }
    .lsh { padding: 7px 10px; font-size: .68rem; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: #64748b; }
    .lsh.dr  { text-align: right; color: #15803d; }
    .lsh.cr  { text-align: right; color: #dc2626; }
    .lsh.div { background: #e2e8f0; }

    .cat-header { display: grid; grid-template-columns: 1fr 2px 1fr; background: #e8edf5; border-top: 2px solid #cbd5e1; }
    .cat-label  { padding: 8px 14px; font-size: .7rem; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; color: #475569; }
    .cat-div    { background: #cbd5e1; }

    .acct-row { border-top: 1px solid #f1f5f9; }
    .acct-row:hover .acct-num,
    .acct-row:hover .acct-name,
    .acct-row:hover .acct-dr,
    .acct-row:hover .acct-cr { filter: brightness(.96); }

    .acct-num  { padding: 8px 10px; font-size: .78rem; color: #94a3b8; font-family: monospace; background: #fff; }
    .acct-name { padding: 8px 10px; font-size: .84rem; color: #1a1a2e; display: flex; align-items: center; gap: 6px; background: #fff; }
    .acct-dr   { padding: 8px 10px; font-size: .82rem; color: #15803d; font-weight: 600; text-align: right; font-family: monospace; white-space: nowrap; background: #fff; }
    .acct-cr   { padding: 8px 10px; font-size: .82rem; color: #dc2626; font-weight: 600; text-align: right; font-family: monospace; white-space: nowrap; background: #fff; }
    .acct-div  { background: #e2e8f0; }

    /* Added row — green tint on current year side (cols 6-9) */
    .acct-row .curr-num.added-cell,
    .acct-row .curr-name.added-cell,
    .acct-row .curr-dr.added-cell,
    .acct-row .curr-cr.added-cell { background: rgba(34,197,94,.08); }
    .acct-row .curr-name.added-cell { color: #14532d; }

    /* Removed row — red tint on previous year side (cols 1-4) */
    .acct-row .prev-num.removed-cell,
    .acct-row .prev-name.removed-cell,
    .acct-row .prev-dr.removed-cell,
    .acct-row .prev-cr.removed-cell { background: rgba(239,68,68,.07); }
    .acct-row .prev-name.removed-cell { color: #7f1d1d; }

    /* Empty cells */
    .empty-cell { background: #fafafa !important; color: transparent !important; }

    .acct-badge { font-size: .65rem; font-weight: 700; padding: 1px 5px; border-radius: 3px; flex-shrink: 0; text-transform: uppercase; letter-spacing: .3px; }
    .acct-badge.new { background: #bbf7d0; color: #14532d; }
    .acct-badge.del { background: #fecaca; color: #7f1d1d; }

    /* Trial balance footer */
    .tb-footer {
      display: grid;
      grid-template-columns: 1fr 2px 1fr;
      border-top: 2px solid #1a1a2e;
      background: #f8fafc;
    }
    .tb-side {
      padding: 14px 0;
      display: grid;
      grid-template-columns: 80px 1fr 110px 110px;
    }
    .tb-div { background: #1a1a2e; }
    .tb-label {
      grid-column: 1 / 3;
      padding: 4px 14px;
      font-size: .78rem;
      font-weight: 700;
      color: #374151;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tb-label.total-row { color: #1a1a2e; font-size: .8rem; border-top: 1px solid #e2e8f0; padding-top: 8px; margin-top: 4px; }
    .tb-total-dr {
      padding: 4px 10px;
      font-size: .82rem;
      font-weight: 700;
      color: #15803d;
      text-align: right;
      font-family: monospace;
    }
    .tb-total-cr {
      padding: 4px 10px;
      font-size: .82rem;
      font-weight: 700;
      color: #dc2626;
      text-align: right;
      font-family: monospace;
    }
    .tb-status {
      grid-column: 1 / 5;
      margin: 8px 14px 4px;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: .82rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .tb-status.ok  { background: #dcfce7; color: #14532d; }
    .tb-status.err { background: #fee2e2; color: #991b1b; }

    @media (max-width: 1200px) {
      .ledger-sub-header, .acct-row { grid-template-columns: 70px 1fr 95px 95px 2px 70px 1fr 95px 95px; }
      .tb-side { grid-template-columns: 70px 1fr 95px 95px; }
    }
    @media (max-width: 960px) {
      .ledger-sub-header, .acct-row { grid-template-columns: 55px 1fr 80px 80px 2px 55px 1fr 80px 80px; }
      .acct-num { font-size: .72rem; } .acct-dr, .acct-cr { font-size: .76rem; }
      .tb-side { grid-template-columns: 55px 1fr 80px 80px; }
    }
    @media (max-width: 700px) {
      .upload-row  { grid-template-columns: 1fr; padding: 16px; }
      .actions     { padding: 16px; }
      .results     { padding: 16px 16px 40px; }
      header       { padding: 16px; }
      .ai-progress { margin: 12px 16px 0; }
    }
  </style>
</head>
<body>

<header>
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
    <path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2V9M9 21H5a2 2 0 0 1-2-2V9m0 0h18"/>
  </svg>
  <h1>Reconcile Tool</h1>
  <span class="badge">Financial</span>
  <span class="ai-badge">AI</span>
</header>

<div id="error-container"></div>

<div class="upload-row">
  <div class="upload-card" id="card-prev" ondragover="handleDragOver(event,'prev')" ondragleave="handleDragLeave('prev')" ondrop="handleDrop(event,'prev')">
    <div class="year-label">Left / Prior Period</div>
    <h2>Previous Year</h2>
    <input type="file" id="file-prev" accept=".csv,.xlsx,.xls" onchange="handleFile(event,'prev')" />
    <div class="drop-zone" id="drop-prev" onclick="document.getElementById('file-prev').click()">
      <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      <p>Drop your file here or <strong>browse</strong></p>
      <span class="file-types">CSV · XLSX · XLS</span>
    </div>
    <div id="info-prev" style="display:none"></div>
  </div>

  <div class="upload-card" id="card-curr" ondragover="handleDragOver(event,'curr')" ondragleave="handleDragLeave('curr')" ondrop="handleDrop(event,'curr')">
    <div class="year-label">Right / Current Period</div>
    <h2>Current Year</h2>
    <input type="file" id="file-curr" accept=".csv,.xlsx,.xls" onchange="handleFile(event,'curr')" />
    <div class="drop-zone" id="drop-curr" onclick="document.getElementById('file-curr').click()">
      <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      <p>Drop your file here or <strong>browse</strong></p>
      <span class="file-types">CSV · XLSX · XLS</span>
    </div>
    <div id="info-curr" style="display:none"></div>
  </div>
</div>

<div class="actions">
  <button class="btn-ai" id="btn-ai" onclick="runWithAI()" disabled>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
      <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
    </svg>
    Run with AI
  </button>
  <button class="btn-reconcile" id="btn-reconcile" onclick="runBasic()" disabled>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/>
      <polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/>
    </svg>
    Run Basic
  </button>
  <button class="btn-reset" onclick="resetAll()">Reset</button>
</div>

<div class="ai-progress" id="ai-progress">
  <div class="prog-title"><span class="spinning">✦</span> AI is analyzing your data…</div>
  <div class="prog-steps" id="prog-steps"></div>
</div>

<div class="results" id="results" style="display:none"></div>

<script>
  const state = {
    prev: { rows: null, headers: [], cols: null, fileName: '' },
    curr: { rows: null, headers: [], cols: null, fileName: '' }
  };

  const ANTHROPIC_API_KEY = '__ANTHROPIC_API_KEY__';

  /* ── Column auto-detection ──────────────────────────────────────── */

  function detectCols(headers) {
    const h = headers.map(x => x.toLowerCase());

    function find(kws) {
      for (const kw of kws) {
        const i = h.findIndex(x => x.includes(kw));
        if (i !== -1) return i;
      }
      return -1;
    }

    const numIdx  = find(['gl code','gl #','acct #','account #','account no','acct no','acct number','account number','gl','code','num']);
    const nameIdx = find(['account name','account desc','description','account','name','desc']);
    const drIdx   = find(['debit','dr ','dr$',' dr']);
    const crIdx   = find(['credit','cr ','cr$',' cr']);
    const balIdx  = find(['balance','amount','total','ytd','net']);

    return {
      num:  numIdx  >= 0 ? numIdx  : -1,
      name: nameIdx >= 0 ? nameIdx : 0,   // fallback to first col
      dr:   drIdx   >= 0 ? drIdx   : -1,
      cr:   crIdx   >= 0 ? crIdx   : -1,
      bal:  balIdx  >= 0 ? balIdx  : -1,
    };
  }

  /* ── File handling ─────────────────────────────────────────────── */

  function showError(msg) {
    document.getElementById('error-container').innerHTML = `<div class="error-banner">${msg}</div>`;
    setTimeout(() => document.getElementById('error-container').innerHTML = '', 7000);
  }

  function handleDragOver(e, s) { e.preventDefault(); document.getElementById('card-'+s).classList.add('dragover'); }
  function handleDragLeave(s)   { document.getElementById('card-'+s).classList.remove('dragover'); }
  function handleDrop(e, s)     { e.preventDefault(); handleDragLeave(s); const f = e.dataTransfer.files[0]; if (f) processFile(f, s); }
  function handleFile(e, s)     { const f = e.target.files[0]; if (f) processFile(f, s); }

  function processFile(file, side) {
    const ext = file.name.split('.').pop().toLowerCase();
    if (!['csv','xlsx','xls'].includes(ext)) { showError('Unsupported file type — use CSV, XLSX, or XLS.'); return; }
    const reader = new FileReader();
    reader.onload = e => {
      try {
        let rows;
        if (ext === 'csv') { rows = parseCSV(e.target.result); }
        else {
          const wb = XLSX.read(e.target.result, { type: 'array' });
          rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '' });
        }
        rows = rows.filter(r => r.some(c => String(c).trim() !== ''));
        if (rows.length < 2) { showError('File appears empty.'); return; }
        const headers = rows[0].map(h => String(h).trim());
        const cols = detectCols(headers);
        state[side] = { rows: rows.slice(1), headers, cols, fileName: file.name };
        renderFileInfo(side, file.name, rows.length - 1, headers, cols);
        checkReady();
      } catch(err) { showError('Could not parse file: ' + err.message); }
    };
    if (ext === 'csv') reader.readAsText(file); else reader.readAsArrayBuffer(file);
  }

  function parseCSV(text) {
    return text.trim().split('\n').map(line => {
      const cols=[]; let cur=''; let inQ=false;
      for (const ch of line) {
        if (ch==='"') inQ=!inQ;
        else if (ch===',' && !inQ) { cols.push(cur.trim()); cur=''; }
        else cur+=ch;
      }
      cols.push(cur.trim()); return cols;
    });
  }

  function renderFileInfo(side, name, count, headers, cols) {
    const el = document.getElementById('info-'+side);
    el.style.display = 'block';

    const pills = [];
    if (cols.num  >= 0) pills.push(`# → ${headers[cols.num]}`);
    pills.push(`Name → ${headers[cols.name]}`);
    if (cols.dr   >= 0) pills.push(`Debit → ${headers[cols.dr]}`);
    if (cols.cr   >= 0) pills.push(`Credit → ${headers[cols.cr]}`);
    if (cols.bal  >= 0 && cols.dr < 0) pills.push(`Balance → ${headers[cols.bal]}`);

    el.innerHTML = `
      <div class="file-info">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        <div><div class="fname">${escHtml(name)}</div><div class="fmeta">${count.toLocaleString()} rows detected</div></div>
        <button class="clear-btn" onclick="clearSide('${side}')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="detected-cols">${pills.map(p=>`<span class="col-pill">${escHtml(p)}</span>`).join('')}</div>`;

    document.getElementById('drop-'+side).style.display = 'none';
    document.getElementById('card-'+side).classList.add('loaded');
  }

  function clearSide(side) {
    state[side] = { rows:null, headers:[], cols:null, fileName:'' };
    document.getElementById('info-'+side).style.display = 'none';
    document.getElementById('drop-'+side).style.display = 'flex';
    document.getElementById('card-'+side).classList.remove('loaded');
    document.getElementById('file-'+side).value = '';
    checkReady();
    document.getElementById('results').style.display = 'none';
  }

  function checkReady() {
    const ok = state.prev.rows && state.curr.rows;
    document.getElementById('btn-reconcile').disabled = !ok;
    document.getElementById('btn-ai').disabled = !ok;
  }

  /* ── Extract rows ───────────────────────────────────────────────── */

  function extractRows(side) {
    const { rows, cols } = state[side];
    const seen = new Set();
    const out  = [];

    for (const r of rows) {
      const name = String(r[cols.name] ?? '').trim();
      if (!name) continue;
      const key = name.toLowerCase();
      if (seen.has(key)) continue;
      seen.add(key);

      let dr = '', cr = '';

      if (cols.dr >= 0 || cols.cr >= 0) {
        // File has explicit debit/credit columns
        const rawDr = parseNum(r[cols.dr]);
        const rawCr = parseNum(r[cols.cr]);
        dr = rawDr !== 0 ? rawDr : '';
        cr = rawCr !== 0 ? rawCr : '';
      } else if (cols.bal >= 0) {
        // Single balance column — positive = debit, negative = credit
        const bal = parseNum(r[cols.bal]);
        if (bal > 0)      dr = bal;
        else if (bal < 0) cr = Math.abs(bal);
      }

      out.push({
        num:  cols.num >= 0 ? String(r[cols.num] ?? '').trim() : '',
        name,
        dr,
        cr,
      });
    }
    return out;
  }

  function parseNum(v) {
    if (v === '' || v === null || v === undefined) return 0;
    const n = parseFloat(String(v).replace(/[^0-9.\-]/g,''));
    return isNaN(n) ? 0 : n;
  }

  function fmtAmt(v) {
    if (v === '' || v === null || v === undefined || v === 0) return '';
    const n = typeof v === 'number' ? v : parseNum(v);
    if (n === 0) return '';
    return Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function fmtFull(v) {
    const n = typeof v === 'number' ? v : parseNum(v);
    return n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function trialBalance(rows) {
    let totalDr = 0, totalCr = 0;
    for (const r of rows) {
      totalDr += typeof r.dr === 'number' ? r.dr : parseNum(r.dr);
      totalCr += typeof r.cr === 'number' ? r.cr : parseNum(r.cr);
    }
    const diff      = Math.abs(totalDr - totalCr);
    const balanced  = diff < 0.005;
    return { totalDr, totalCr, diff, balanced };
  }

  /* ── Basic run ─────────────────────────────────────────────────── */

  function runBasic() {
    const prevRows = extractRows('prev');
    const currRows = extractRows('curr');

    prevRows.sort((a,b) => (a.num && b.num)
      ? a.num.localeCompare(b.num, undefined, {numeric:true})
      : a.name.localeCompare(b.name));
    currRows.sort((a,b) => (a.num && b.num)
      ? a.num.localeCompare(b.num, undefined, {numeric:true})
      : a.name.localeCompare(b.name));

    const prevMap = new Map(prevRows.map(r => [r.name.toLowerCase(), r]));
    const currMap = new Map(currRows.map(r => [r.name.toLowerCase(), r]));

    const tableRows = [];
    prevRows.forEach(p => {
      const c = currMap.get(p.name.toLowerCase()) || null;
      tableRows.push({ prev:p, curr:c, status: c ? 'matched' : 'removed' });
    });
    currRows.forEach(c => {
      if (!prevMap.has(c.name.toLowerCase()))
        tableRows.push({ prev:null, curr:c, status:'added' });
    });

    const categories = [{ name:'All Accounts', rows:tableRows }];
    const added   = tableRows.filter(r=>r.status==='added').map(r=>r.curr.name);
    const removed = tableRows.filter(r=>r.status==='removed').map(r=>r.prev.name);
    renderResults({ categories, added, removed,
      matchedCount: tableRows.filter(r=>r.status==='matched').length,
      prevFile: state.prev.fileName, currFile: state.curr.fileName,
      prevTB: trialBalance(prevRows), currTB: trialBalance(currRows),
      aiInsight: null });
  }

  /* ── AI run ─────────────────────────────────────────────────────── */

  const STEPS = [
    { id:'extract', label:'Reading and parsing both files' },
    { id:'analyze', label:'AI categorizing, cleaning and aligning accounts' },
    { id:'insight', label:'AI generating financial insights' },
  ];

  function setStep(id) {
    document.getElementById('prog-steps').innerHTML = STEPS.map(s => {
      const di=STEPS.findIndex(x=>x.id===id), ti=STEPS.findIndex(x=>x.id===s.id);
      const cls=ti<di?'done':s.id===id?'active':'';
      const icon=ti<di?'✓':s.id===id?'<span class="spinning">↻</span>':'○';
      return `<div class="prog-step ${cls}"><div class="step-icon">${icon}</div><span>${s.label}</span></div>`;
    }).join('');
  }

  async function callClaude(prompt, maxTokens=8192) {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{
        'x-api-key': ANTHROPIC_API_KEY,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true',
        'content-type':'application/json'
      },
      body: JSON.stringify({ model:'claude-sonnet-4-6', max_tokens:maxTokens, messages:[{role:'user',content:prompt}] })
    });
    if (!res.ok) { const e=await res.json().catch(()=>({})); throw new Error(e.error?.message||`API ${res.status}`); }
    return (await res.json()).content[0].text;
  }

  async function runWithAI() {
    const prevRows = extractRows('prev');
    const currRows = extractRows('curr');

    const progEl = document.getElementById('ai-progress');
    progEl.style.display = 'block';
    document.getElementById('results').style.display = 'none';
    document.getElementById('btn-ai').disabled = true;
    document.getElementById('btn-reconcile').disabled = true;

    try {
      setStep('extract');
      await sleep(200);

      setStep('analyze');

      const fmtList = rows => rows.map(r =>
        [r.num, r.name,
         r.dr !== '' ? `DR:${r.dr}` : '',
         r.cr !== '' ? `CR:${r.cr}` : '']
        .filter(Boolean).join(' | ')
      ).join('\n');

      const prompt = `You are a financial data analyst performing a year-over-year account reconciliation.

Each account entry: [Account# | ] Account Name [ | DR:debit] [ | CR:credit]

Tasks:
1. Clean account names (fix caps/spacing, expand abbreviations: A/R→Accounts Receivable, PP&E→Property Plant & Equipment).
2. Group all accounts from BOTH years into: Assets, Liabilities, Equity, Revenue, Cost of Revenue, Operating Expenses, Other Income/Expense.
3. Sort within each category by account number if present, else standard financial order.
4. Match accounts that appear in both years (fuzzy name match OK — use the cleaner name).
5. Layout: matched accounts on same row. Removed (prev only) at bottom of category. Added (curr only) at bottom of category.

Return ONLY raw JSON, no markdown:
{"categories":[{"name":"Category","rows":[{"status":"matched|added|removed","prev":{"num":"1000","name":"Cash","dr":50000,"cr":0},"curr":{"num":"1000","name":"Cash","dr":72000,"cr":0}}]}]}

- prev is null when status="added", curr is null when status="removed"
- dr and cr are numbers (0 if empty)
- Include every account

PREVIOUS YEAR:
${fmtList(prevRows)}

CURRENT YEAR:
${fmtList(currRows)}`;

      const raw = await callClaude(prompt, 8192);
      let parsed;
      try {
        const clean = raw.replace(/^```[a-z]*\n?/,'').replace(/\n?```$/,'').trim();
        parsed = JSON.parse(clean);
      } catch(e) { throw new Error('AI returned unexpected format. Please try again.'); }

      const categories = parsed.categories || [];
      const added   = categories.flatMap(c=>c.rows.filter(r=>r.status==='added').map(r=>r.curr?.name).filter(Boolean));
      const removed = categories.flatMap(c=>c.rows.filter(r=>r.status==='removed').map(r=>r.prev?.name).filter(Boolean));
      const matchedCount = categories.flatMap(c=>c.rows.filter(r=>r.status==='matched')).length;

      setStep('insight');
      let insight = '';
      if (added.length > 0 || removed.length > 0) {
        insight = await callClaude(
          `Financial analyst: summarize in 2-3 professional sentences what these year-over-year account changes suggest about the business. No bullets.
Added: ${added.slice(0,20).join(', ')}${added.length>20?'…':''}
Removed: ${removed.slice(0,20).join(', ')}${removed.length>20?'…':''}
Matched: ${matchedCount}`, 512);
      }

      progEl.style.display = 'none';
      renderResults({ categories, added, removed, matchedCount,
        prevFile: state.prev.fileName, currFile: state.curr.fileName,
        prevTB: trialBalance(prevRows), currTB: trialBalance(currRows),
        aiInsight: insight });

    } catch(err) {
      progEl.style.display = 'none';
      showError('AI error: ' + err.message);
    } finally {
      checkReady();
    }
  }

  function sleep(ms) { return new Promise(r=>setTimeout(r,ms)); }

  /* ── Render ─────────────────────────────────────────────────────── */

  function tbSideHTML(tb) {
    const statusCls  = tb.balanced ? 'ok' : 'err';
    const statusIcon = tb.balanced ? '✓' : '✕';
    const statusText = tb.balanced
      ? 'Balanced'
      : `Out of balance by ${fmtFull(tb.diff)}`;
    return `
      <div class="tb-side">
        <div class="tb-label">Total Debits</div>
        <div class="tb-total-dr">${fmtFull(tb.totalDr)}</div>
        <div class="tb-total-cr"></div>
        <div class="tb-label">Total Credits</div>
        <div class="tb-total-dr"></div>
        <div class="tb-total-cr">${fmtFull(tb.totalCr)}</div>
        <div class="tb-status ${statusCls}">${statusIcon} ${statusText}</div>
      </div>`;
  }

  function renderResults({ categories, added, removed, matchedCount, prevFile, currFile, prevTB, currTB, aiInsight }) {
    const el = document.getElementById('results');
    el.style.display = 'block';

    const insightHTML = aiInsight ? `
      <div class="ai-insight">
        <div class="insight-label">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
          </svg>AI Insight
        </div>${escHtml(aiInsight)}
      </div>` : '';

    let ledgerHTML = '';
    for (const cat of categories) {
      ledgerHTML += `
        <div class="cat-header">
          <div class="cat-label">${escHtml(cat.name)}</div>
          <div class="cat-div"></div>
          <div class="cat-label"></div>
        </div>`;

      for (const row of cat.rows) {
        const isAdded   = row.status === 'added';
        const isRemoved = row.status === 'removed';

        const pCls = isRemoved ? 'removed-cell' : '';
        const cCls = isAdded   ? 'added-cell'   : '';

        const p = row.prev;
        const c = row.curr;

        const prevBadge = isRemoved ? '<span class="acct-badge del">Removed</span>' : '';
        const currBadge = isAdded   ? '<span class="acct-badge new">New</span>'     : '';

        const pDr = p ? fmtAmt(p.dr) : '';
        const pCr = p ? fmtAmt(p.cr) : '';
        const cDr = c ? fmtAmt(c.dr) : '';
        const cCr = c ? fmtAmt(c.cr) : '';

        ledgerHTML += `<div class="acct-row">
          <div class="acct-num prev-num ${pCls}${!p?' empty-cell':''}">${p ? escHtml(p.num||'') : ''}</div>
          <div class="acct-name prev-name ${pCls}${!p?' empty-cell':''}">${p ? prevBadge+escHtml(p.name||'') : ''}</div>
          <div class="acct-dr prev-dr ${pCls}${!p?' empty-cell':''}">${pDr}</div>
          <div class="acct-cr prev-cr ${pCls}${!p?' empty-cell':''}">${pCr}</div>
          <div class="acct-div"></div>
          <div class="acct-num curr-num ${cCls}${!c?' empty-cell':''}">${c ? escHtml(c.num||'') : ''}</div>
          <div class="acct-name curr-name ${cCls}${!c?' empty-cell':''}">${c ? currBadge+escHtml(c.name||'') : ''}</div>
          <div class="acct-dr curr-dr ${cCls}${!c?' empty-cell':''}">${cDr}</div>
          <div class="acct-cr curr-cr ${cCls}${!c?' empty-cell':''}">${cCr}</div>
        </div>`;
      }
    }

    el.innerHTML = `
      <div class="results-header">
        <h2>Reconciliation Results</h2>
        <button class="export-btn" onclick="exportResults(${JSON.stringify(added)}, ${JSON.stringify(removed)})">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
          </svg>Export CSV
        </button>
      </div>

      <div class="summary-row">
        <div class="chip added"><div class="dot"></div>${added.length} Added</div>
        <div class="chip removed"><div class="dot"></div>${removed.length} Removed</div>
        <div class="chip matched"><div class="dot"></div>${matchedCount} Matched</div>
      </div>

      ${insightHTML}

      <div class="legend">
        <div class="legend-item"><div class="legend-swatch dr-s"></div>Debit (positive)</div>
        <div class="legend-item"><div class="legend-swatch cr-s"></div>Credit (negative)</div>
        <div class="legend-item"><div class="legend-swatch added-s"></div>New account</div>
        <div class="legend-item"><div class="legend-swatch removed-s"></div>Removed account</div>
      </div>

      <div class="ledger-wrap">
        <div class="ledger-top-header">
          <div class="lth">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            Previous Year &mdash; ${escHtml(prevFile)}
          </div>
          <div class="lth">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            Current Year &mdash; ${escHtml(currFile)}
          </div>
        </div>
        <div class="ledger-sub-header">
          <div class="lsh">Acct #</div>
          <div class="lsh">Account Name</div>
          <div class="lsh dr">Debit</div>
          <div class="lsh cr">Credit</div>
          <div class="lsh div"></div>
          <div class="lsh">Acct #</div>
          <div class="lsh">Account Name</div>
          <div class="lsh dr">Debit</div>
          <div class="lsh cr">Credit</div>
        </div>
        ${ledgerHTML}
        <div class="tb-footer">
          ${tbSideHTML(prevTB)}
          <div class="tb-div"></div>
          ${tbSideHTML(currTB)}
        </div>
      </div>`;

    el.scrollIntoView({ behavior:'smooth', block:'start' });
  }

  /* ── Export ─────────────────────────────────────────────────────── */

  function exportResults(added, removed) {
    const rows = [['Status','Account Name']];
    added.forEach(a => rows.push(['Added', a]));
    removed.forEach(a => rows.push(['Removed', a]));
    const csv = rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob([csv],{type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url; a.download='reconciliation_results.csv'; a.click();
    URL.revokeObjectURL(url);
  }

  function resetAll() {
    clearSide('prev'); clearSide('curr');
    document.getElementById('results').style.display = 'none';
    document.getElementById('ai-progress').style.display = 'none';
    document.getElementById('error-container').innerHTML = '';
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
</body>
</html>
