<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reconcile Tool</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ── SST CPA Design Tokens ── */
    :root {
      --bg:        #f4f6f5;
      --surface:   #ffffff;
      --surface2:  #f0f4f2;
      --surface3:  #e4ede9;
      --border:    #d0dbd6;
      --border2:   #b0c4bc;
      --text:      #0d2b24;
      --text2:     #3d6055;
      --text3:     #7a9e94;
      --teal:      #0a3d32;
      --teal-mid:  #0d5c49;
      --teal-light:#1a7a61;
      --teal-dim:  #e0eeea;
      --teal-bg:   rgba(10,61,50,.08);
      --green:     #16a34a;
      --green-dim: #dcfce7;
      --green-bg:  rgba(22,163,74,.10);
      --red:       #dc2626;
      --red-dim:   #fee2e2;
      --red-bg:    rgba(220,38,38,.10);
      --mono:      'JetBrains Mono', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; }

    /* ── Header ── */
    header {
      border-bottom: 1px solid var(--border);
      padding: 0 40px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--surface);
      position: sticky; top: 0; z-index: 100;
    }
    .logo-mark {
      width: 28px; height: 28px;
      background: var(--teal);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    header h1 { font-size: 1rem; font-weight: 600; letter-spacing: -.01em; color: var(--teal); }
    header .sep { color: var(--border2); font-size: 1.2rem; font-weight: 200; }
    header .sub { font-size: .82rem; color: var(--text3); }
    .badge {
      margin-left: auto;
      background: var(--teal-dim);
      color: var(--teal);
      border: 1px solid rgba(10,61,50,.2);
      font-size: .68rem; padding: 2px 8px; border-radius: 4px;
      font-weight: 600; letter-spacing: .8px; text-transform: uppercase;
      font-family: var(--mono);
    }
    .ai-badge {
      background: rgba(22,163,74,.12);
      color: var(--green);
      border: 1px solid rgba(22,163,74,.25);
      font-size: .68rem; padding: 2px 8px; border-radius: 4px;
      font-weight: 600; letter-spacing: .8px; text-transform: uppercase;
      font-family: var(--mono);
    }

    /* ── Layout ── */
    .upload-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 28px 40px 0; }

    .upload-card {
      background: var(--surface);
      border-radius: 8px;
      padding: 24px;
      border: 1px solid var(--border);
      transition: border-color .15s;
      cursor: pointer;
    }
    .upload-card.dragover { border-color: var(--teal-mid); box-shadow: 0 0 0 3px var(--teal-bg); }
    .upload-card.loaded   { border-color: var(--green); cursor: default; }
    .upload-card .year-label {
      font-size: .68rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
      color: var(--text3); margin-bottom: 6px; font-family: var(--mono);
    }
    .upload-card h2 { font-size: .95rem; font-weight: 600; margin-bottom: 16px; color: var(--text); }

    .drop-zone {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; padding: 32px 20px; border-radius: 6px;
      background: var(--surface2);
      border: 1px dashed var(--border2);
      transition: border-color .15s;
    }
    .upload-card.dragover .drop-zone { border-color: var(--teal-mid); }
    .drop-zone svg { color: var(--text3); }
    .drop-zone p { font-size: .88rem; color: var(--text2); text-align: center; }
    .drop-zone p strong { color: var(--teal-mid); cursor: pointer; }
    .drop-zone .file-types { font-size: .72rem; color: var(--text3); font-family: var(--mono); }
    input[type="file"] { display: none; }

    .file-info {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; background: var(--green-bg);
      border: 1px solid rgba(34,197,94,.2);
      border-radius: 6px; margin-top: 4px;
    }
    .file-info svg { color: var(--green); flex-shrink: 0; }
    .file-info .fname { font-size: .84rem; font-weight: 500; color: var(--green); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--mono); }
    .file-info .fmeta { font-size: .72rem; color: var(--text3); }
    .clear-btn { margin-left: auto; background: none; border: none; cursor: pointer; color: var(--text3); padding: 3px; border-radius: 4px; display: flex; align-items: center; flex-shrink: 0; }
    .clear-btn:hover { color: var(--red); background: var(--red-bg); }

    .detected-cols { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
    .col-pill {
      font-size: .68rem; font-weight: 500; padding: 2px 7px; border-radius: 4px;
      background: var(--surface3); color: var(--text2);
      border: 1px solid var(--border2); font-family: var(--mono);
    }

    /* ── Actions ── */
    .actions { display: flex; justify-content: center; padding: 24px 40px 0; gap: 10px; flex-wrap: wrap; }

    .btn-ai {
      background: var(--teal); color: #fff;
      border: none; padding: 10px 28px; border-radius: 6px;
      font-size: .88rem; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; gap: 7px;
      transition: opacity .15s, transform .1s;
      font-family: 'Inter', sans-serif;
    }
    .btn-ai:hover:not(:disabled) { opacity: .88; }
    .btn-ai:active:not(:disabled) { transform: scale(.98); }
    .btn-ai:disabled { opacity: .3; cursor: not-allowed; }

    .btn-reset {
      background: transparent; color: var(--text3);
      border: 1px solid var(--border); padding: 10px 20px; border-radius: 6px;
      font-size: .88rem; font-weight: 500; cursor: pointer;
      font-family: 'Inter', sans-serif;
    }
    .btn-reset:hover { color: var(--text2); border-color: var(--border2); }

    /* ── Progress ── */
    .ai-progress {
      margin: 20px 40px 0;
      background: var(--surface);
      border-radius: 8px;
      border: 1px solid var(--border);
      padding: 18px 22px;
      display: none;
    }
    .ai-progress .prog-title {
      font-size: .84rem; font-weight: 600; color: var(--teal);
      margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
    }
    .prog-steps { display: flex; flex-direction: column; gap: 8px; }
    .prog-step { display: flex; align-items: center; gap: 10px; font-size: .82rem; color: var(--text3); }
    .prog-step .step-icon {
      width: 18px; height: 18px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; font-size: .65rem;
      background: var(--surface3); color: var(--text3);
    }
    .prog-step.done   { color: var(--green); }
    .prog-step.done .step-icon   { background: var(--green-bg); color: var(--green); }
    .prog-step.active { color: var(--teal-mid); font-weight: 500; }
    .prog-step.active .step-icon { background: var(--teal-bg); color: var(--teal-mid); }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinning { animation: spin .8s linear infinite; display: inline-block; }

    /* ── Error ── */
    .error-banner {
      background: var(--red-bg); border: 1px solid rgba(239,68,68,.25);
      color: var(--red); padding: 11px 14px; border-radius: 6px;
      font-size: .84rem; margin: 12px 40px 0;
    }
    .warn-banner {
      background: rgba(245,158,11,.08); border: 1px solid rgba(245,158,11,.3);
      color: #92400e; padding: 11px 14px; border-radius: 6px;
      font-size: .84rem; margin: 12px 40px 0;
    }

    /* ── Results ── */
    .results { padding: 28px 40px 56px; }
    .results-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
    .results-header h2 { font-size: 1rem; font-weight: 600; color: var(--text); }

    .export-btn {
      background: var(--surface2); border: 1px solid var(--border2);
      padding: 7px 14px; border-radius: 6px; font-size: .8rem; font-weight: 500;
      cursor: pointer; display: flex; align-items: center; gap: 6px;
      color: var(--text2); transition: border-color .15s;
    }
    .export-btn:hover { border-color: var(--border2); color: var(--text); }
    .export-group { display: flex; gap: 8px; }

    .summary-row { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
    .chip {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 12px; border-radius: 4px;
      font-size: .78rem; font-weight: 600; font-family: var(--mono);
    }
    .chip.added   { background: var(--green-bg);  color: var(--green); border: 1px solid rgba(34,197,94,.2); }
    .chip.removed { background: var(--red-bg);    color: var(--red);   border: 1px solid rgba(239,68,68,.2); }
    .chip.matched { background: var(--surface2);  color: var(--text2); border: 1px solid var(--border); }
    .chip .dot { width: 6px; height: 6px; border-radius: 50%; }
    .chip.added .dot   { background: var(--green); }
    .chip.removed .dot { background: var(--red); }
    .chip.matched .dot { background: var(--text3); }

    .legend { display: flex; gap: 14px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: .74rem; color: var(--text3); }
    .legend-swatch { width: 12px; height: 12px; border-radius: 2px; }
    .legend-swatch.added-s   { background: var(--green-bg); border: 1px solid rgba(34,197,94,.3); }
    .legend-swatch.removed-s { background: var(--red-bg);   border: 1px solid rgba(239,68,68,.3); }
    .legend-swatch.dr-s      { background: var(--green-bg); border: 1px solid rgba(34,197,94,.3); }
    .legend-swatch.cr-s      { background: var(--red-bg);   border: 1px solid rgba(239,68,68,.3); }
    .num-inherited { color: var(--teal-mid); font-weight: 700; cursor: help; }

    /* ── Ledger ── */
    .ledger-wrap { border-radius: 8px; border: 1px solid var(--border); background: var(--surface); }

    .ledger-top-header { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface2); border-radius: 7px 7px 0 0; }
    .lth {
      padding: 10px 14px; font-size: .72rem; font-weight: 600;
      letter-spacing: .6px; text-transform: uppercase;
      display: flex; align-items: center; gap: 7px;
      color: var(--text2); font-family: var(--mono);
    }
    .lth:first-child { border-right: 1px solid var(--border); }

    .ledger-sub-header,
    .acct-row { display: grid; grid-template-columns: 80px 1fr 110px 110px 1px 80px 1fr 110px 110px 110px; }

    .ledger-sub-header { background: var(--surface3); border-bottom: 1px solid var(--border); position: sticky; top: 56px; z-index: 5; }
    .lsh { padding: 6px 10px; font-size: .65rem; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--text3); font-family: var(--mono); }
    .lsh.dr  { text-align: right; color: var(--green); }
    .lsh.cr  { text-align: right; color: var(--red); }
    .lsh.div { background: var(--border); }

    .cat-header { display: grid; grid-template-columns: 1fr 1px 1fr; background: var(--surface2); border-top: 1px solid var(--border); }
    .cat-label  { padding: 7px 14px; font-size: .65rem; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--teal); font-family: var(--mono); }
    .cat-div    { background: var(--border); }

    .acct-row { border-top: 1px solid var(--border); }
    .acct-row:hover .acct-num,
    .acct-row:hover .acct-name,
    .acct-row:hover .acct-dr,
    .acct-row:hover .acct-cr,
    .acct-row:hover .acct-chg { background: var(--surface3) !important; }

    .acct-num  { padding: 8px 10px; font-size: .76rem; color: var(--text3); font-family: var(--mono); background: var(--surface); }
    .acct-name { padding: 8px 10px; font-size: .84rem; color: var(--text); display: flex; align-items: center; gap: 6px; background: var(--surface); }
    .acct-dr   { padding: 8px 10px; font-size: .8rem; color: var(--green); font-weight: 500; text-align: right; font-family: var(--mono); white-space: nowrap; background: var(--surface); }
    .acct-cr   { padding: 8px 10px; font-size: .8rem; color: var(--red); font-weight: 500; text-align: right; font-family: var(--mono); white-space: nowrap; background: var(--surface); }
    .acct-chg  { padding: 8px 10px; font-size: .8rem; font-weight: 500; text-align: right; font-family: var(--mono); white-space: nowrap; background: var(--surface); color: var(--text3); }
    .acct-chg.pos { color: var(--green); }
    .acct-chg.neg { color: var(--red); }
    .lsh.chg   { text-align: right; color: var(--text3); }
    .acct-div  { background: var(--border); }

    .acct-row .curr-num.added-cell,
    .acct-row .curr-name.added-cell,
    .acct-row .curr-dr.added-cell,
    .acct-row .curr-cr.added-cell { background: var(--green-bg) !important; }
    .acct-row .curr-name.added-cell { color: var(--green); }

    .acct-row .prev-num.removed-cell,
    .acct-row .prev-name.removed-cell,
    .acct-row .prev-dr.removed-cell,
    .acct-row .prev-cr.removed-cell { background: var(--red-bg) !important; }
    .acct-row .prev-name.removed-cell { color: var(--red); }

    .empty-cell { background: var(--surface2) !important; color: transparent !important; }

    .acct-badge { font-size: .62rem; font-weight: 700; padding: 1px 5px; border-radius: 3px; flex-shrink: 0; text-transform: uppercase; letter-spacing: .3px; font-family: var(--mono); }
    .acct-badge.new { background: var(--green-bg); color: var(--green); border: 1px solid rgba(34,197,94,.25); }
    .acct-badge.del { background: var(--red-bg);   color: var(--red);   border: 1px solid rgba(239,68,68,.25); }

    /* ── Trial Balance Footer ── */
    .tb-footer {
      display: grid; grid-template-columns: 1fr 1px 1fr 110px;
      border-top: 1px solid var(--border);
      background: var(--surface2);
      border-radius: 0 0 7px 7px;
    }
    .tb-chg-cell { background: var(--surface2); border-left: 1px solid var(--border); }
    .tb-side {
      padding: 14px 0;
      display: grid;
      grid-template-columns: 80px 1fr 110px 110px;
    }
    .tb-div { background: var(--border); }
    .tb-label {
      grid-column: 1 / 3; padding: 4px 14px;
      font-size: .76rem; font-weight: 500; color: var(--text2);
      display: flex; align-items: center; gap: 6px;
    }
    .tb-total-dr { padding: 4px 10px; font-size: .8rem; font-weight: 600; color: var(--green); text-align: right; font-family: var(--mono); }
    .tb-total-cr { padding: 4px 10px; font-size: .8rem; font-weight: 600; color: var(--red);   text-align: right; font-family: var(--mono); }
    .tb-status {
      grid-column: 1 / 5; margin: 8px 14px 6px;
      padding: 7px 12px; border-radius: 5px;
      font-size: .8rem; font-weight: 600;
      display: flex; align-items: center; gap: 7px; font-family: var(--mono);
    }
    .tb-status.ok  { background: var(--green-bg); color: var(--green); border: 1px solid rgba(34,197,94,.2); }
    .tb-status.err { background: var(--red-bg);   color: var(--red);   border: 1px solid rgba(239,68,68,.2); }

    /* ── Account changes summary ── */
    .changes-summary {
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
      margin-top: 16px;
    }
    @media (max-width: 700px) { .changes-summary { grid-template-columns: 1fr; } }
    .changes-col {
      background: var(--surface); border-radius: 8px; border: 1px solid var(--border);
      overflow: hidden;
    }
    .changes-col-head {
      display: flex; align-items: center; gap: 7px;
      padding: 10px 14px; font-size: .76rem; font-weight: 700;
      letter-spacing: .8px; text-transform: uppercase; font-family: var(--mono);
    }
    .changes-col.added-col   .changes-col-head { background: var(--green-bg); color: var(--green); }
    .changes-col.removed-col .changes-col-head { background: var(--red-bg);   color: var(--red); }
    .changes-list { list-style: none; }
    .changes-list li {
      padding: 7px 14px; font-size: .82rem; color: var(--text);
      border-top: 1px solid var(--border);
      display: flex; align-items: baseline; gap: 8px;
    }
    .changes-list li { cursor: pointer; transition: background .15s; }
    .changes-list li:hover { background: var(--teal-bg); }
    .changes-list li .ch-num { font-family: var(--mono); font-size: .72rem; color: var(--text3); min-width: 44px; }
    .changes-list li .ch-amt { font-family: var(--mono); font-size: .75rem; margin-left: auto; padding-left: 12px; white-space: nowrap; }
    .changes-list li .ch-amt.dr { color: var(--green); }
    .changes-list li .ch-amt.cr { color: var(--red); }
    .changes-empty { padding: 14px; font-size: .8rem; color: var(--text3); font-style: italic; }
    @keyframes row-flash {
      0%   { background: rgba(13,148,136,.18); }
      100% { background: transparent; }
    }
    .acct-row.flash { animation: row-flash 1.6s ease-out forwards; }

    .stats-summary { margin-top: 16px; }
    .stats-title {
      font-size: .76rem; font-weight: 700; letter-spacing: .8px; text-transform: uppercase;
      font-family: var(--mono); color: var(--text3); margin-bottom: 10px;
    }
    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px;
    }
    .stat-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      padding: 12px 14px; position: relative;
    }
    .stat-card.anomaly { border-color: var(--red); box-shadow: 0 0 0 1px var(--red); }
    .anomaly-badge {
      display: flex; align-items: center; gap: 6px; width: 100%;
      background: var(--red-bg); color: var(--red); border: none; border-radius: 6px;
      font-size: .72rem; font-weight: 600; padding: 6px 9px; margin-bottom: 8px;
      cursor: pointer; text-align: left; font-family: inherit;
    }
    .anomaly-badge:hover { background: var(--red-dim); }
    .anomaly-badge svg { flex-shrink: 0; }
    .anomaly-badge .dismiss-x { margin-left: auto; opacity: .6; }
    .anomaly-badge:hover .dismiss-x { opacity: 1; }
    .stat-name { font-size: .78rem; color: var(--text3); margin-bottom: 6px; }
    .stat-amounts { font-family: var(--mono); font-size: .82rem; color: var(--text); margin-bottom: 6px; }
    .stat-pct { font-size: .9rem; font-weight: 700; }
    .stat-pct.up   { color: var(--green); }
    .stat-pct.down { color: var(--red); }
    .stat-pct.flat { color: var(--text3); }

    .prog-elapsed { margin-top: 10px; font-size: .76rem; color: var(--text3); font-family: var(--mono); }

    @media (max-width: 1200px) {
      .ledger-sub-header, .acct-row { grid-template-columns: 70px 1fr 95px 95px 1px 70px 1fr 95px 95px 95px; }
      .tb-side { grid-template-columns: 70px 1fr 95px 95px; }
      .tb-footer { grid-template-columns: 1fr 1px 1fr 95px; }
    }
    @media (max-width: 960px) {
      .ledger-sub-header, .acct-row { grid-template-columns: 55px 1fr 80px 80px 1px 55px 1fr 80px 80px 80px; }
      .tb-side { grid-template-columns: 55px 1fr 80px 80px; }
      .tb-footer { grid-template-columns: 1fr 1px 1fr 80px; }
    }
    @media (max-width: 700px) {
      .upload-row  { grid-template-columns: 1fr; padding: 16px; }
      .actions     { padding: 16px; }
      .results     { padding: 16px 16px 40px; }
      header       { padding: 0 16px; }
      .ai-progress, .error-banner { margin-left: 16px; margin-right: 16px; }
    }

    .nav-link { font-size: .8rem; color: var(--text3); text-decoration: none; padding: 5px 10px; border-radius: 5px; border: 1px solid var(--border); transition: color .15s, border-color .15s; white-space: nowrap; }
    .nav-link:hover { color: var(--teal-mid); border-color: var(--border2); }

    @media print {
      header, .upload-row, .actions, .ai-progress, .error-banner, .export-group, .btn-reset { display: none !important; }
      .num-inherited { display: none !important; }
      .legend-item:has(.num-inherited) { display: none !important; }
      body { background: #fff; }
      .results { padding: 0; }
      .ledger-wrap, .changes-summary, .stats-summary { break-inside: avoid; }
      .acct-row, .stat-card, .changes-list li { break-inside: avoid; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo-mark">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4">
      <path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2V9M9 21H5a2 2 0 0 1-2-2V9m0 0h18"/>
    </svg>
  </div>
  <h1>Reconcile Tool</h1>
  <span class="sep">|</span>
  <span class="sub">SST Accountants &amp; Consultants</span>
  <span class="badge">Financial</span>
  <span class="ai-badge">AI</span>

        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>

<script>
  const state = {
    prev: { rows: null, headers: [], cols: null, fileName: '' },
    curr: { rows: null, headers: [], cols: null, fileName: '' }
  };

  // Snapshot of the most recently rendered reconciliation, used by the export buttons.
  let lastResults = null;

  /* ── Column auto-detection ──────────────────────────────────────── */

  function detectCols(headers) {
    const h = headers.map(x => x.toLowerCase());

    function find(kws) {
      for (const kw of kws) {
        const i = h.findIndex(x => x.includes(kw));
        if (i !== -1) return i;
      }
      return -1;
    }

    const numIdx  = find(['gl code','gl #','acct #','account #','account no','acct no','acct number','account number','gl','code','num']);
    const nameIdx = find(['account name','account desc','description','account','name','desc']);
    const drIdx   = find(['debit','dr ','dr$',' dr']);
    const crIdx   = find(['credit','cr ','cr$',' cr']);
    const balIdx  = find(['balance','amount','total','ytd','net']);

    return {
      num:  numIdx  >= 0 ? numIdx  : -1,
      name: nameIdx >= 0 ? nameIdx : 0,   // fallback to first col
      dr:   drIdx   >= 0 ? drIdx   : -1,
      cr:   crIdx   >= 0 ? crIdx   : -1,
      bal:  balIdx  >= 0 ? balIdx  : -1,
    };
  }

  /* ── File handling ─────────────────────────────────────────────── */

  function showError(msg) {
    document.getElementById('error-container').innerHTML = `<div class="error-banner">${msg}</div>`;
    setTimeout(() => document.getElementById('error-container').innerHTML = '', 7000);
  }

  function showWarning(msg) {
    document.getElementById('error-container').innerHTML += `<div class="warn-banner">${msg}</div>`;
  }

  function fmtChg(prev, curr) {
    if (!prev || !curr) return '';
    const delta = ((curr.dr||0) - (curr.cr||0)) - ((prev.dr||0) - (prev.cr||0));
    if (Math.abs(delta) < 0.005) return '';
    const abs = Math.abs(delta).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return delta > 0 ? `+${abs}` : `(${abs})`;
  }

  function handleDragOver(e, s) { e.preventDefault(); document.getElementById('card-'+s).classList.add('dragover'); }
  function handleDragLeave(s)   { document.getElementById('card-'+s).classList.remove('dragover'); }
  function handleDrop(e, s)     { e.preventDefault(); handleDragLeave(s); const f = e.dataTransfer.files[0]; if (f) processFile(f, s); }
  function handleFile(e, s)     { const f = e.target.files[0]; if (f) processFile(f, s); }

  function processFile(file, side) {
    const ext = file.name.split('.').pop().toLowerCase();
    if (!['csv','xlsx','xls'].includes(ext)) { showError('Unsupported file type — use CSV, XLSX, or XLS.'); return; }
    const reader = new FileReader();
    reader.onload = e => {
      try {
        let rows;
        if (ext === 'csv') { rows = parseCSV(e.target.result); }
        else {
          const wb = XLSX.read(e.target.result, { type: 'array' });
          rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '' });
        }
        rows = rows.filter(r => r.some(c => String(c).trim() !== ''));
        if (rows.length < 2) { showError('File appears empty.'); return; }
        const headers = rows[0].map(h => String(h).trim());
        const cols = detectCols(headers);
        state[side] = { rows: rows.slice(1), headers, cols, fileName: file.name };
        renderFileInfo(side, file.name, rows.length - 1, headers, cols);
        checkReady();
      } catch(err) { showError('Could not parse file: ' + err.message); }
    };
    if (ext === 'csv') reader.readAsText(file); else reader.readAsArrayBuffer(file);
  }

  function parseCSV(text) {
    return text.trim().split('\n').map(line => {
      const cols=[]; let cur=''; let inQ=false;
      for (const ch of line) {
        if (ch==='"') inQ=!inQ;
        else if (ch===',' && !inQ) { cols.push(cur.trim()); cur=''; }
        else cur+=ch;
      }
      cols.push(cur.trim()); return cols;
    });
  }

  function renderFileInfo(side, name, count, headers, cols) {
    const el = document.getElementById('info-'+side);
    el.style.display = 'block';

    const pills = [];
    if (cols.num  >= 0) pills.push(`# → ${headers[cols.num]}`);
    pills.push(`Name → ${headers[cols.name]}`);
    if (cols.dr   >= 0) pills.push(`Debit → ${headers[cols.dr]}`);
    if (cols.cr   >= 0) pills.push(`Credit → ${headers[cols.cr]}`);
    if (cols.bal  >= 0 && cols.dr < 0) pills.push(`Balance → ${headers[cols.bal]}`);

    el.innerHTML = `
      <div class="file-info">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        <div><div class="fname">${escHtml(name)}</div><div class="fmeta">${count.toLocaleString()} rows detected</div></div>
        <button class="clear-btn" onclick="clearSide('${side}')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="detected-cols">${pills.map(p=>`<span class="col-pill">${escHtml(p)}</span>`).join('')}</div>`;

    document.getElementById('drop-'+side).style.display = 'none';
    document.getElementById('card-'+side).classList.add('loaded');
  }

  function clearSide(side) {
    state[side] = { rows:null, headers:[], cols:null, fileName:'' };
    document.getElementById('info-'+side).style.display = 'none';
    document.getElementById('drop-'+side).style.display = 'flex';
    document.getElementById('card-'+side).classList.remove('loaded');
    document.getElementById('file-'+side).value = '';
    checkReady();
    document.getElementById('results').style.display = 'none';
  }

  function checkReady() {
    const ok = state.prev.rows && state.curr.rows;
    document.getElementById('btn-ai').disabled = !ok;
  }

  /* ── Extract rows ───────────────────────────────────────────────── */

  function extractRows(side) {
    const { rows, cols } = state[side];
    const seen = new Set();
    const out  = [];
    const dupes = [];

    for (const r of rows) {
      const name = String(r[cols.name] ?? '').trim();
      if (!name) continue;
      const key = name.toLowerCase();
      if (seen.has(key)) { dupes.push(name); continue; }
      seen.add(key);

      let dr = '', cr = '';

      if (cols.dr >= 0 || cols.cr >= 0) {
        // File has explicit debit/credit columns
        let rawDr = parseNum(r[cols.dr]);
        let rawCr = parseNum(r[cols.cr]);
        // Normalize sign anomalies — a negative value in one column is a contra
        // entry that belongs in the other column (debits/credits are magnitudes).
        if (rawDr < 0) { rawCr += -rawDr; rawDr = 0; }
        if (rawCr < 0) { rawDr += -rawCr; rawCr = 0; }
        dr = rawDr !== 0 ? rawDr : '';
        cr = rawCr !== 0 ? rawCr : '';
      } else if (cols.bal >= 0) {
        // Single balance column — positive = debit, negative = credit
        const bal = parseNum(r[cols.bal]);
        if (bal > 0)      dr = bal;
        else if (bal < 0) cr = Math.abs(bal);
      }

      out.push({
        num:  cols.num >= 0 ? String(r[cols.num] ?? '').trim() : '',
        name,
        dr,
        cr,
      });
    }
    return { rows: out, dupes };
  }

  function parseNum(v) {
    if (v === '' || v === null || v === undefined) return 0;
    // Keep digits, decimal points, sign, and scientific-notation markers (e/E/+)
    // so values like "1.5e10" or "(1,234.56)" parse correctly rather than being mangled.
    let s = String(v).trim();
    const isParenWrapped = /^\(.*\)$/.test(s);
    s = s.replace(/[^0-9.\-eE+]/g, '');
    let n = parseFloat(s);
    if (isNaN(n)) return 0;
    // Parenthetical notation (e.g. ($3,800) or (3,800)) is an accounting
    // display convention meaning "this is the amount in this column" — it does
    // NOT mean the value should flip to the opposite column. Treat it as the
    // absolute value and let the debit/credit column placement define the sign.
    // Explicit minus signs (e.g. -3800 with no parens) still signal a sign
    // anomaly that the extractRows normalisation will move to the correct column.
    if (isParenWrapped) n = Math.abs(n);
    return n;
  }

  function fmtAmt(v) {
    if (v === '' || v === null || v === undefined || v === 0) return '';
    const n = typeof v === 'number' ? v : parseNum(v);
    if (n === 0) return '';
    return Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function fmtFull(v) {
    const n = typeof v === 'number' ? v : parseNum(v);
    return n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function trialBalance(rows) {
    let totalDr = 0, totalCr = 0;
    for (const r of rows) {
      totalDr += typeof r.dr === 'number' ? r.dr : parseNum(r.dr);
      totalCr += typeof r.cr === 'number' ? r.cr : parseNum(r.cr);
    }
    const diff      = Math.abs(totalDr - totalCr);
    const balanced  = diff < 0.005;
    return { totalDr, totalCr, diff, balanced };
  }

  /* ── AI run ─────────────────────────────────────────────────────── */

  const STEPS = [
    { id:'extract', label:'Reading and parsing both files' },
    { id:'analyze', label:'AI categorizing, cleaning and aligning accounts' },
  ];

  function setStep(id) {
    document.getElementById('prog-steps').innerHTML = STEPS.map(s => {
      const di=STEPS.findIndex(x=>x.id===id), ti=STEPS.findIndex(x=>x.id===s.id);
      const cls=ti<di?'done':s.id===id?'active':'';
      const icon=ti<di?'✓':s.id===id?'<span class="spinning">↻</span>':'○';
      return `<div class="prog-step ${cls}"><div class="step-icon">${icon}</div><span>${s.label}</span></div>`;
    }).join('');
  }

  // Calls our own server-side proxy at /api/claude — the Anthropic API key lives
  // only on the server and is never exposed to the browser.
  async function callClaude(prompt, maxTokens=8192, { timeoutMs=240000, retries=1 } = {}) {
    let lastErr;
    for (let attempt = 0; attempt <= retries; attempt++) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const res = await fetch('/api/claude', {
          method:'POST',
          signal: controller.signal,
          headers: { 'content-type':'application/json' },
          body: JSON.stringify({ prompt, maxTokens })
        });
        clearTimeout(timer);

        const data = await res.json().catch(()=>({}));

        if (!res.ok) {
          const msg = res.status === 413
            ? 'These files are too large to reconcile in a single AI run. Try splitting them into smaller batches (e.g. by account range or category) and running each separately.'
            : (data.error || `Server error (${res.status})`);
          // Retry on rate limit / transient server errors only
          if ((res.status === 429 || res.status >= 500) && attempt < retries) {
            lastErr = new Error(msg);
            await sleep(1000 * (attempt + 1));
            continue;
          }
          throw new Error(msg);
        }

        if (!data.text) throw new Error('AI returned an empty response.');
        return data.text;

      } catch (err) {
        clearTimeout(timer);
        if (err.name === 'AbortError') {
          lastErr = new Error('The AI took too long to respond (large ledgers can take a few minutes to categorize). Please try again — if it keeps timing out, try splitting the files into smaller batches.');
        } else {
          lastErr = err;
        }
        if (attempt < retries && (err.name === 'AbortError' || err instanceof TypeError)) {
          await sleep(1000 * (attempt + 1));
          continue;
        }
        throw lastErr;
      }
    }
    throw lastErr;
  }

  async function runWithAI() {
    const { rows: prevRows, dupes: prevDupes } = extractRows('prev');
    const { rows: currRows, dupes: currDupes } = extractRows('curr');

    const progEl = document.getElementById('ai-progress');
    const elapsedEl = document.getElementById('prog-elapsed');
    progEl.style.display = 'block';
    document.getElementById('results').style.display = 'none';
    document.getElementById('btn-ai').disabled = true;

    const startedAt = Date.now();
    const elapsedTimer = setInterval(() => {
      const secs = Math.floor((Date.now() - startedAt) / 1000);
      const mins = Math.floor(secs / 60);
      const rem = secs % 60;
      const timeStr = mins > 0 ? `${mins}m ${rem}s` : `${secs}s`;
      const note = secs > 60 ? ' — large ledgers can take a few minutes, hang tight' : '';
      elapsedEl.textContent = `Elapsed: ${timeStr}${note}`;
    }, 1000);

    try {
      setStep('extract');
      await sleep(200);

      setStep('analyze');

      const fmtRow = r =>
        [r.num, r.name,
         r.dr !== '' ? `DR:${r.dr}` : '',
         r.cr !== '' ? `CR:${r.cr}` : '']
        .filter(Boolean).join(' | ');

      // ── PHASE 1: code-based exact matching (deterministic) ───────────────────
      // Matching is too important to leave to an LLM. Exact-name matches are
      // identified here in code — the AI's only remaining job is category assignment.
      const normName = s => String(s||'').trim().toLowerCase()
        .replace(/[-–—]/g,' ').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();

      if (prevDupes.length || currDupes.length) {
        const parts = [];
        if (prevDupes.length) parts.push(`Prior year: ${prevDupes.map(escHtml).join(', ')}`);
        if (currDupes.length) parts.push(`Current year: ${currDupes.map(escHtml).join(', ')}`);
        showWarning(`Duplicate account names were found and skipped — ${parts.join(' · ')}`);
      }

      const currByName = new Map();
      for (const r of currRows) {
        const key = normName(r.name);
        if (!currByName.has(key)) currByName.set(key, []);
        currByName.get(key).push(r);
      }

      const preMatched   = []; // { prev, curr }
      const unmatchedPrev = [];
      const unmatchedCurr = new Map(currRows.map(r => [r, true])); // track which curr rows are consumed

      for (const p of prevRows) {
        const key = normName(p.name);
        const candidates = currByName.get(key);
        if (candidates && candidates.length) {
          const c = candidates.shift(); // consume one curr row
          if (!candidates.length) currByName.delete(key);
          preMatched.push({ prev: p, curr: c });
          unmatchedCurr.delete(c);
        } else {
          unmatchedPrev.push(p);
        }
      }
      const unmatchedCurrArr = [...unmatchedCurr.keys()];

      // ── PHASE 2: AI assigns categories (not matching) ────────────────────────
      // The AI sees three labelled groups and must ONLY assign a category to each.
      // Statuses are already decided: preMatched=matched, unmatchedPrev=removed,
      // unmatchedCurrArr=added (unless AI finds a fuzzy match among unmatched only).
      const buildPrompt = (matchedSlice, prevSlice, currSlice, isBatch) => {
        const matchedLines = matchedSlice.map(({prev,curr}) =>
          `  ${fmtRow(prev)}  ↔  ${fmtRow(curr)}`).join('\n') || '  (none)';
        const prevLines = prevSlice.map(r => '  ' + fmtRow(r)).join('\n') || '  (none)';
        const currLines = currSlice.map(r => '  ' + fmtRow(r)).join('\n') || '  (none)';
        return `You are a financial data analyst. Your ONLY job is to assign each account to a category and clean its name.${isBatch ? ' (this is one slice of a larger ledger)' : ''}

CATEGORIES (use exactly these names): Assets, Liabilities, Equity, Revenue, Cost of Revenue, Operating Expenses, Other Income/Expense

SECTION A — ALREADY MATCHED pairs (one from each year, same account). Status is "matched". Assign category and clean names:
${matchedLines}

SECTION B — PRIOR YEAR only (status "removed" unless a clear fuzzy match exists in Section C — e.g. same account renamed):
${prevLines}

SECTION C — CURRENT YEAR only (status "added" unless a clear fuzzy match exists in Section B — e.g. same account renamed):
${currLines}

Output format — follow EXACTLY, machine-parsed:
{"categories":[{"name":"Category","rows":[{"status":"matched|added|removed","prev":{"num":"1000","name":"Cash","dr":50000,"cr":0},"curr":{"num":"1000","name":"Cash","dr":72000,"cr":0}}]}]}

Rules:
- Respond with ONLY the JSON — no markdown fences, no preamble, no trailing text. Start with { end with }.
- Strictly valid JSON: escape double-quotes and backslashes inside strings.
- prev is null when status="added", curr is null when status="removed"
- dr and cr are numbers (0 if empty/blank)
- Include EVERY account from all three sections above — nothing may be omitted
- Do NOT match a Section A account to a Section B or C account — Section A pairs are final`;
      };

      const BATCH_SIZE = 80; // accounts per AI call (matched pairs count as 1)
      const sortByName = arr => [...arr].sort((a,b) =>
        normName(a.name||'').localeCompare(normName(b.name||'')));

      const preMatchedSorted  = sortByName(preMatched.map(m=>({...m, _key: normName(m.prev.name)}))).map(m=>({prev:m.prev,curr:m.curr}));
      const unmatchedPrevSorted = sortByName(unmatchedPrev);
      const unmatchedCurrSorted = sortByName(unmatchedCurrArr);

      const totalSlots = preMatchedSorted.length + unmatchedPrevSorted.length + unmatchedCurrSorted.length;
      const numBatches = Math.max(1, Math.ceil(totalSlots / BATCH_SIZE));
      const mChunk = Math.ceil(preMatchedSorted.length  / numBatches) || 1;
      const pChunk = Math.ceil(unmatchedPrevSorted.length / numBatches) || 0;
      const cChunk = Math.ceil(unmatchedCurrSorted.length / numBatches) || 0;

      const batchEl = document.getElementById('prog-batch');
      const categoryIndex = new Map();
      const mergedCategories = [];

      for (let b = 0; b < numBatches; b++) {
        const mSlice = preMatchedSorted.slice(b * mChunk, (b + 1) * mChunk);
        const pSlice = unmatchedPrevSorted.slice(b * pChunk, (b + 1) * pChunk);
        const cSlice = unmatchedCurrSorted.slice(b * cChunk, (b + 1) * cChunk);
        if (!mSlice.length && !pSlice.length && !cSlice.length) continue;

        if (numBatches > 1) {
          batchEl.textContent = `Processing batch ${b + 1} of ${numBatches}…`;
        }

        const basePrompt = buildPrompt(mSlice, pSlice, cSlice, numBatches > 1);
        let parsed, raw, parseErr;
        for (let pass = 0; pass < 2; pass++) {
          const prompt = pass === 0 ? basePrompt : `${basePrompt}

Your previous response could not be parsed as JSON. Respond again with ONLY a single valid JSON object — no markdown, no commentary, no text before or after it, and make sure every string is properly escaped.`;
          raw = await callClaude(prompt, 32000, { timeoutMs: 240000 });
          try {
            parsed = parseAIJson(raw);
            parseErr = null;
            break;
          } catch (e) {
            parseErr = e;
          }
        }
        if (parseErr) {
          console.error('AI categorization — raw response that failed to parse:', raw);
          const trimmed = raw.trim();
          const looksTruncated = !trimmed.endsWith('}') && !trimmed.endsWith('```');
          throw new Error(looksTruncated
            ? 'The AI response was too large and got cut off. Try reconciling smaller files or fewer accounts at a time.'
            : 'AI returned an unexpected format. Please try again — if this keeps happening, try smaller files.');
        }

        for (const cat of parsed.categories || []) {
          let entry = categoryIndex.get(cat.name);
          if (!entry) {
            entry = { name: cat.name, rows: [] };
            categoryIndex.set(cat.name, entry);
            mergedCategories.push(entry);
          }
          entry.rows.push(...(cat.rows || []));
        }
      }
      batchEl.textContent = '';

      // Shared normalisation and utility used by all post-processing passes.
      const norm = normName;
      const fallbackCat = () => {
        let cat = mergedCategories.find(c => c.name === 'Other');
        if (!cat) { cat = { name: 'Other', rows: [] }; mergedCategories.push(cat); }
        return cat;
      };

      // ── POST-PROCESSING PASS 0: enforce pre-matched pairs ───────────────────
      // The AI sometimes ignores Section A and re-emits pre-matched accounts as
      // removed + added anyway. Correct this before any other pass:
      // 1. Remove any "removed" or "added" row whose name matches a pre-matched pair.
      // 2. Ensure every pre-matched pair appears as a "matched" row (inject if missing).
      const preMatchedPrevNorm = new Map(preMatched.map(m => [norm(m.prev.name), m]));
      const preMatchedCurrNorm = new Map(preMatched.map(m => [norm(m.curr.name), m]));
      const preMatchedPrevNums = new Map(preMatched.filter(m=>m.prev.num).map(m=>[String(m.prev.num).trim(), m]));

      // Strip any AI-generated removed/added rows that belong to pre-matched accounts
      for (const cat of mergedCategories) {
        cat.rows = cat.rows.filter(row => {
          if (row.status === 'removed' && row.prev) {
            const key = norm(row.prev.name);
            const byNum = row.prev.num && preMatchedPrevNums.has(String(row.prev.num).trim());
            return !preMatchedPrevNorm.has(key) && !byNum;
          }
          if (row.status === 'added' && row.curr) {
            return !preMatchedCurrNorm.has(norm(row.curr.name));
          }
          return true;
        });
      }

      // Ensure every pre-matched pair has a matched row somewhere in the output
      const seenMatchedPrev = new Set();
      for (const cat of mergedCategories)
        for (const row of cat.rows)
          if (row.status === 'matched' && row.prev) seenMatchedPrev.add(norm(row.prev.name));

      for (const m of preMatched) {
        if (!seenMatchedPrev.has(norm(m.prev.name))) {
          fallbackCat().rows.push({ status: 'matched', prev: m.prev, curr: m.curr });
        }
      }

      // ── POST-PROCESSING PASS 1: force-merge exact-name duplicates ────────────
      // The AI can place the same account name in both "removed" (prev-only) and
      // "added" (curr-only) rows — especially across batch boundaries or when
      // similarly-named accounts confuse it. Deterministically fix that here:
      // any account that appears as both removed and added with an identical
      // normalised name is merged into a single "matched" row.

      // Index every removed row by normalised name → { catIdx, rowIdx, row }
      const removedByName = new Map();
      for (let ci = 0; ci < mergedCategories.length; ci++) {
        const cat = mergedCategories[ci];
        for (let ri = 0; ri < cat.rows.length; ri++) {
          const row = cat.rows[ri];
          if (row.status === 'removed' && row.prev) {
            const key = norm(row.prev.name);
            if (!removedByName.has(key)) removedByName.set(key, []);
            removedByName.get(key).push({ ci, ri, row });
          }
        }
      }

      const rowsToDelete = new Set(); // "ci,ri" strings to remove after merging
      for (let ci = 0; ci < mergedCategories.length; ci++) {
        const cat = mergedCategories[ci];
        for (const row of cat.rows) {
          if (row.status !== 'added' || !row.curr) continue;
          const key = norm(row.curr.name);
          const matches = removedByName.get(key);
          if (!matches || !matches.length) continue;
          const match = matches.shift(); // consume first candidate
          // Promote to matched in place (curr side already here)
          row.status = 'matched';
          row.prev = match.row.prev;
          // Mark the removed row for deletion
          rowsToDelete.add(`${match.ci},${match.ri}`);
        }
      }
      // Delete stale removed rows (iterate in reverse to preserve indices)
      for (let ci = 0; ci < mergedCategories.length; ci++) {
        mergedCategories[ci].rows = mergedCategories[ci].rows.filter(
          (_, ri) => !rowsToDelete.has(`${ci},${ri}`)
        );
      }

      // ── POST-PROCESSING PASS 2: coverage check ───────────────────────────────
      // Ensure every account from the original input files appears in the output.
      // If the AI silently dropped an account, inject it back as added/removed
      // so nothing is ever lost.
      // Match by account number first (exact), then fall back to normalised name.
      const seenPrevNums  = new Set();
      const seenPrevNames = new Set();
      const seenCurrNums  = new Set();
      const seenCurrNames = new Set();
      // Pre-matched pairs are guaranteed accounted for on both sides regardless
      // of what the AI named them — seed them directly from the original input rows
      // so AI renames don't cause false "missing" detections.
      for (const m of preMatched) {
        if (m.prev.num) seenPrevNums.add(String(m.prev.num).trim());
        seenPrevNames.add(norm(m.prev.name));
        if (m.curr.num) seenCurrNums.add(String(m.curr.num).trim());
        seenCurrNames.add(norm(m.curr.name));
      }
      for (const cat of mergedCategories) {
        for (const row of cat.rows) {
          if (row.prev) { if (row.prev.num) seenPrevNums.add(String(row.prev.num).trim()); seenPrevNames.add(norm(row.prev.name)); }
          if (row.curr) { if (row.curr.num) seenCurrNums.add(String(row.curr.num).trim()); seenCurrNames.add(norm(row.curr.name)); }
        }
      }

      const isSeen = (r, numSet, nameSet) =>
        (r.num && numSet.has(String(r.num).trim())) || nameSet.has(norm(r.name));

      for (const r of prevRows) {
        if (!isSeen(r, seenPrevNums, seenPrevNames))
          fallbackCat().rows.push({ status: 'removed', prev: r, curr: null });
      }
      for (const r of currRows) {
        if (!isSeen(r, seenCurrNums, seenCurrNames))
          fallbackCat().rows.push({ status: 'added', prev: null, curr: r });
      }

      // Remove any categories that ended up empty
      for (let i = mergedCategories.length - 1; i >= 0; i--) {
        if (!mergedCategories[i].rows.length) mergedCategories.splice(i, 1);
      }

      // ── POST-PROCESSING PASS 3: account-number carry-forward ─────────────────
      // If the current year has no account number but its matched prior-year
      // counterpart does, carry the prior year's number forward so the new
      // ledger inherits consistent account numbering.
      for (const cat of mergedCategories) {
        for (const row of cat.rows) {
          if (row.status === 'matched' && row.prev && row.curr && row.prev.num && !row.curr.num) {
            row.curr.num = row.prev.num;
            row.curr.numInherited = true;
          }
        }
      }

      // ── POST-PROCESSING PASS 4: canonical category ordering ──────────────────
      const CAT_ORDER = ['Assets','Liabilities','Equity','Revenue','Cost of Revenue','Operating Expenses','Other Income/Expense'];
      mergedCategories.sort((a, b) => {
        const ai = CAT_ORDER.indexOf(a.name), bi = CAT_ORDER.indexOf(b.name);
        if (ai === -1 && bi === -1) return a.name.localeCompare(b.name);
        if (ai === -1) return 1;
        if (bi === -1) return -1;
        return ai - bi;
      });

      const categories = mergedCategories;
      const added   = categories.flatMap(c=>c.rows.filter(r=>r.status==='added').map(r=>r.curr?.name).filter(Boolean));
      const removed = categories.flatMap(c=>c.rows.filter(r=>r.status==='removed').map(r=>r.prev?.name).filter(Boolean));
      const matchedCount = categories.flatMap(c=>c.rows.filter(r=>r.status==='matched')).length;

      progEl.style.display = 'none';
      renderResults({ categories, added, removed, matchedCount,
        prevFile: state.prev.fileName, currFile: state.curr.fileName,
        prevTB: trialBalance(prevRows), currTB: trialBalance(currRows) });

    } catch(err) {
      progEl.style.display = 'none';
      showError('AI error: ' + err.message);
    } finally {
      clearInterval(elapsedTimer);
      elapsedEl.textContent = '';
      document.getElementById('prog-batch').textContent = '';
      checkReady();
    }
  }

  function sleep(ms) { return new Promise(r=>setTimeout(r,ms)); }

  // Robustly extract JSON from an LLM response that may include markdown fences
  // and/or stray prose before/after the JSON object.
  function parseAIJson(raw) {
    const attempts = [];

    // 1) Strip a leading/trailing markdown code fence, if present
    attempts.push(raw.replace(/^```[a-z]*\n?/i, '').replace(/\n?```\s*$/i, '').trim());

    // 2) Slice from the first '{' to the last '}' (handles stray prose around the JSON)
    const start = raw.indexOf('{');
    const end = raw.lastIndexOf('}');
    if (start !== -1 && end !== -1 && end > start) {
      attempts.push(raw.slice(start, end + 1).trim());
    }

    // 3) Raw text as-is
    attempts.push(raw.trim());

    for (const candidate of attempts) {
      try { return JSON.parse(candidate); } catch (_) { /* try next */ }
    }

    // 4) Last resort: strip stray control characters and trailing commas, which
    // LLMs occasionally emit inside otherwise-valid-looking JSON.
    for (const candidate of attempts) {
      const cleaned = candidate
        .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '')
        .replace(/,(\s*[}\]])/g, '$1');
      try { return JSON.parse(cleaned); } catch (_) { /* try next */ }
    }

    throw new Error('Could not parse JSON from AI response');
  }

  /* ── Render ─────────────────────────────────────────────────────── */

  function tbSideHTML(tb) {
    const statusCls  = tb.balanced ? 'ok' : 'err';
    const statusIcon = tb.balanced ? '✓' : '✕';
    const statusText = tb.balanced
      ? 'Balanced'
      : `Out of balance by ${fmtFull(tb.diff)}`;
    return `
      <div class="tb-side">
        <div class="tb-label">Total Debits</div>
        <div class="tb-total-dr">${fmtFull(tb.totalDr)}</div>
        <div class="tb-total-cr"></div>
        <div class="tb-label">Total Credits</div>
        <div class="tb-total-dr"></div>
        <div class="tb-total-cr">${fmtFull(tb.totalCr)}</div>
        <div class="tb-status ${statusCls}">${statusIcon} ${statusText}</div>
      </div>`;
  }

  function changesListHTML(entries, emptyMsg) {
    if (!entries.length) return `<div class="changes-empty">${emptyMsg}</div>`;
    return `<ul class="changes-list">${entries.map(e => {
      const hasDr = e.dr && e.dr !== 0 && e.dr !== '';
      const hasCr = e.cr && e.cr !== 0 && e.cr !== '';
      const amtHTML = hasDr
        ? `<span class="ch-amt dr">${fmtFull(e.dr)}</span>`
        : hasCr
          ? `<span class="ch-amt cr">(${fmtFull(e.cr)})</span>`
          : '';
      const clickAttr = e.rowId ? ` onclick="scrollToAcct('${e.rowId}')" title="Click to jump to this account in the ledger"` : '';
      return `<li${clickAttr}>
        ${e.num ? `<span class="ch-num">${escHtml(e.num)}</span>` : ''}
        <span>${escHtml(e.name)}${e.category ? ` <span style="color:var(--text3);">— ${escHtml(e.category)}</span>` : ''}</span>
        ${amtHTML}
      </li>`;
    }).join('')}</ul>`;
  }

  function changesSummaryHTML(categories) {
    const added = [], removed = [];
    for (const cat of categories) {
      for (const row of cat.rows) {
        if (row.status === 'added' && row.curr) {
          const rowId = `acct-row-${(row.curr.num||row.curr.name||'').replace(/[^a-z0-9]/gi,'-').toLowerCase()}`;
          added.push({ num: row.curr.num, name: row.curr.name, category: cat.name, dr: row.curr.dr, cr: row.curr.cr, rowId });
        }
        if (row.status === 'removed' && row.prev) {
          const rowId = `acct-row-${(row.prev.num||row.prev.name||'').replace(/[^a-z0-9]/gi,'-').toLowerCase()}`;
          removed.push({ num: row.prev.num, name: row.prev.name, category: cat.name, dr: row.prev.dr, cr: row.prev.cr, rowId });
        }
      }
    }
    return `
      <div class="changes-summary">
        <div class="changes-col removed-col">
          <div class="changes-col-head">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Removed from Prior Year (${removed.length})
          </div>
          ${changesListHTML(removed, 'No accounts were removed from the prior year.')}
        </div>
        <div class="changes-col added-col">
          <div class="changes-col-head">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Added in Current Year (${added.length})
          </div>
          ${changesListHTML(added, 'No new accounts in the current year.')}
        </div>
      </div>`;
  }

  // Categories whose total swung by this much or more year-over-year get flagged
  // for the accountant to take a closer look at.
  const ANOMALY_THRESHOLD = 90;

  function dismissAnomaly(btn) {
    const card = btn.closest('.stat-card');
    if (card) card.classList.remove('anomaly');
    btn.remove();
  }

  function statsSummaryHTML(categories) {
    const rows = categories.map(cat => {
      let prevTotal = 0, currTotal = 0;
      for (const row of cat.rows) {
        if (row.prev) prevTotal += (row.prev.dr || 0) + (row.prev.cr || 0);
        if (row.curr) currTotal += (row.curr.dr || 0) + (row.curr.cr || 0);
      }
      return { name: cat.name, prevTotal, currTotal };
    }).filter(r => r.prevTotal > 0 || r.currTotal > 0);

    if (!rows.length) return '';

    const cards = rows.map(r => {
      let pct, cls, arrow;
      if (r.prevTotal === 0) {
        pct = r.currTotal === 0 ? 0 : 100;
        cls = r.currTotal === 0 ? 'flat' : 'up';
        arrow = r.currTotal === 0 ? '→' : '▲';
      } else {
        pct = ((r.currTotal - r.prevTotal) / r.prevTotal) * 100;
        cls = Math.abs(pct) < 0.05 ? 'flat' : (pct > 0 ? 'up' : 'down');
        arrow = cls === 'flat' ? '→' : (cls === 'up' ? '▲' : '▼');
      }
      const pctStr = `${cls === 'up' ? '+' : ''}${pct.toFixed(1)}%`;

      const isAnomaly = r.prevTotal > 0 && Math.abs(pct) >= ANOMALY_THRESHOLD;
      const anomalyBadge = isAnomaly ? `
        <button class="anomaly-badge" onclick="dismissAnomaly(this)" title="Click to dismiss this flag">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          <span>Unusual change &mdash; review this category</span>
          <span class="dismiss-x">&times;</span>
        </button>` : '';

      return `
        <div class="stat-card${isAnomaly ? ' anomaly' : ''}">
          ${anomalyBadge}
          <div class="stat-name">${escHtml(r.name)}</div>
          <div class="stat-amounts">${fmtAmt(r.prevTotal)} &rarr; ${fmtAmt(r.currTotal)}</div>
          <div class="stat-pct ${cls}">${arrow} ${pctStr}</div>
        </div>`;
    }).join('');

    return `
      <div class="stats-summary">
        <div class="stats-title">Year-over-Year Change by Category</div>
        <div class="stats-grid">${cards}</div>
      </div>`;
  }

  function renderResults({ categories, added, removed, matchedCount, prevFile, currFile, prevTB, currTB }) {

    el.style.display = 'block';

    let ledgerHTML = '';

      ledgerHTML += `
        <div class="cat-header">

          <div class="cat-div"></div>
          <div class="cat-label"></div>
        </div>`;

      for (const row of cat.rows) {
        const isAdded   = row.status === 'added';
        const isRemoved = row.status === 'removed';

        const pCls = isRemoved ? 'removed-cell' : '';
        const cCls = isAdded   ? 'added-cell'   : '';

        const p = row.prev;
        const c = row.curr;

        const prevBadge = isRemoved ? '<span class="acct-badge del">Removed</span>' : '';
        const currBadge = isAdded   ? '<span class="acct-badge new">New</span>'     : '';

        const pDr = p ? fmtAmt(p.dr) : '';
        const pCr = p ? fmtAmt(p.cr) : '';
        const cDr = c ? fmtAmt(c.dr) : '';
        const cCr = c ? fmtAmt(c.cr) : '';

        const chg = row.status === 'matched' ? fmtChg(p, c) : '';
        const chgCls = chg.startsWith('+') ? 'pos' : (chg ? 'neg' : '');

        const rowId = (isAdded || isRemoved)
          ? `acct-row-${((isRemoved ? (p?.num||p?.name) : (c?.num||c?.name))||'').replace(/[^a-z0-9]/gi,'-').toLowerCase()}`
          : '';
        ledgerHTML += `<div class="acct-row"${rowId ? ` id="${rowId}"` : ''}>
          <div class="acct-num prev-num ${pCls}${!p?' empty-cell':''}">${p ? escHtml(p.num||'') : ''}</div>
          <div class="acct-name prev-name ${pCls}${!p?' empty-cell':''}">${p ? prevBadge+escHtml(p.name||'') : ''}</div>
          <div class="acct-dr prev-dr ${pCls}${!p?' empty-cell':''}">${pDr}</div>
          <div class="acct-cr prev-cr ${pCls}${!p?' empty-cell':''}">${pCr}</div>
          <div class="acct-div"></div>
          <div class="acct-num curr-num ${cCls}${!c?' empty-cell':''}" ${c && c.numInherited ? `title="Carried forward from prior year — not present in the original file"` : ''}>${c ? escHtml(c.num||'') + (c.numInherited ? ' <span class="num-inherited">*</span>' : '') : ''}</div>
          <div class="acct-name curr-name ${cCls}${!c?' empty-cell':''}">${c ? currBadge+escHtml(c.name||'') : ''}</div>
          <div class="acct-dr curr-dr ${cCls}${!c?' empty-cell':''}">${cDr}</div>
          <div class="acct-cr curr-cr ${cCls}${!c?' empty-cell':''}">${cCr}</div>
          <div class="acct-chg ${chgCls}${row.status !== 'matched' ? ' empty-cell' : ''}">${chg}</div>
        </div>`;
      }
    }

    lastResults = { categories, added, removed, matchedCount, prevFile, currFile, prevTB, currTB };

    el.innerHTML = `
      <div class="results-header">
        <h2>Reconciliation Results</h2>
        <div class="export-group">
          <button class="export-btn" onclick="exportCSV()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
            </svg>CSV
          </button>
          <button class="export-btn" onclick="exportExcel()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
            </svg>Excel
          </button>
          <button class="export-btn" onclick="exportPDF()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
            </svg>PDF
          </button>
          <button class="export-btn" onclick="exportCurrentLedger()" title="Export just the current-year ledger — useful for getting a clean copy with account numbers filled in from the prior year">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
            </svg>Current Ledger
          </button>
        </div>
      </div>

      <div class="summary-row">
        <div class="chip added"><div class="dot"></div>${added.length} Added</div>
        <div class="chip removed"><div class="dot"></div>${removed.length} Removed</div>
        <div class="chip matched"><div class="dot"></div>${matchedCount} Matched</div>
      </div>

      <div class="legend">
        <div class="legend-item"><div class="legend-swatch dr-s"></div>Debit (positive)</div>
        <div class="legend-item"><div class="legend-swatch cr-s"></div>Credit (negative)</div>
        <div class="legend-item"><div class="legend-swatch added-s"></div>New account</div>
        <div class="legend-item"><div class="legend-swatch removed-s"></div>Removed account</div>
        <div class="legend-item"><span class="num-inherited">*</span>&nbsp;Account number carried forward from prior year</div>
      </div>

      <div class="ledger-wrap">
        <div class="ledger-top-header">
          <div class="lth">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            Previous Year &mdash; ${escHtml(prevFile)}
          </div>
          <div class="lth">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            Current Year &mdash; ${escHtml(currFile)}
          </div>
        </div>
        <div class="ledger-sub-header">
          <div class="lsh">Acct #</div>
          <div class="lsh">Account Name</div>
          <div class="lsh dr">Debit</div>
          <div class="lsh cr">Credit</div>
          <div class="lsh div"></div>
          <div class="lsh">Acct #</div>
          <div class="lsh">Account Name</div>
          <div class="lsh dr">Debit</div>
          <div class="lsh cr">Credit</div>
          <div class="lsh chg">Change</div>
        </div>
        ${ledgerHTML}
        <div class="tb-footer">
          ${tbSideHTML(prevTB)}
          <div class="tb-div"></div>
          ${tbSideHTML(currTB)}
          <div class="tb-chg-cell"></div>
        </div>
      </div>

      ${changesSummaryHTML(categories)}

      ${statsSummaryHTML(categories)}`;

    el.scrollIntoView({ behavior:'smooth', block:'start' });
  }

  /* ── Export ─────────────────────────────────────────────────────── */

  // Builds one flat table (array of arrays) of the full side-by-side reconciliation,
  // shared by the CSV and Excel exports.
  function buildLedgerTable() {
    const header = ['Category','Status',
      'Prior Acct #','Prior Account Name','Prior Debit','Prior Credit',
      'Current Acct #','Current Account Name','Current Debit','Current Credit','Change'];
    const rows = [header];
    for (const cat of lastResults.categories) {
      for (const row of cat.rows) {
        const p = row.prev, c = row.curr;
        const chg = (row.status === 'matched' && p && c)
          ? ((c.dr||0) - (c.cr||0)) - ((p.dr||0) - (p.cr||0))
          : '';
        rows.push([
          cat.name, row.status,
          p ? (p.num||'') : '', p ? (p.name||'') : '', p ? (p.dr||0) : '', p ? (p.cr||0) : '',
          c ? (c.num||'') : '', c ? (c.name||'') : '', c ? (c.dr||0) : '', c ? (c.cr||0) : '',
          chg
        ]);
      }
    }
    return rows;
  }

  // Builds a standalone table of just the current-year ledger (e.g. so a user whose
  // original file lacked account numbers can export a clean copy with the numbers
  // filled in from the prior year's matched accounts).
  function buildCurrentLedgerTable() {
    const header = ['Category', 'Account #', 'Account Name', 'Debit', 'Credit'];
    const rows = [header];
    for (const cat of lastResults.categories) {
      for (const row of cat.rows) {
        const c = row.curr;
        if (!c) continue;
        rows.push([cat.name, c.num || '', c.name || '', c.dr || 0, c.cr || 0]);
      }
    }
    return rows;
  }

  function exportCurrentLedger() {
    if (!lastResults) return;
    const ledgerData = buildCurrentLedgerTable();
    const ws = XLSX.utils.aoa_to_sheet(ledgerData);

    ws['!cols'] = [{ wch: 22 }, { wch: 13 }, { wch: 36 }, { wch: 15 }, { wch: 15 }];
    ws['!freeze'] = { xSplit: 0, ySplit: 1, topLeftCell: 'A2' };
    ws['!autofilter'] = { ref: `A1:E${ledgerData.length}` };

    const acctFmt = '#,##0.00';
    for (let r = 1; r < ledgerData.length; r++) {
      for (const c of [3, 4]) {
        const ref = XLSX.utils.encode_cell({ r, c });
        if (ws[ref]) ws[ref].z = acctFmt;
      }
    }

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Current Ledger');
    XLSX.writeFile(wb, `${(lastResults.currFile || 'current_ledger').replace(/\.[^.]+$/, '')}_with_account_numbers.xlsx`);
  }

  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
  }

  function exportCSV() {
    if (!lastResults) return;
    const rows = buildLedgerTable();
    const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
    downloadBlob(new Blob([csv], { type: 'text/csv' }), 'reconciliation_results.csv');
  }

  function exportExcel() {
    if (!lastResults) return;
    const { categories, added, removed, matchedCount, prevFile, currFile, prevTB, currTB } = lastResults;

    const wb = XLSX.utils.book_new();

    // ── Reconciliation sheet ──────────────────────────────────────────
    const ledgerData = buildLedgerTable();
    const wsRecon = XLSX.utils.aoa_to_sheet(ledgerData);

    wsRecon['!cols'] = [
      { wch: 22 }, // Category
      { wch: 10 }, // Status
      { wch: 12 }, // Prior Acct #
      { wch: 32 }, // Prior Account Name
      { wch: 15 }, // Prior Debit
      { wch: 15 }, // Prior Credit
      { wch: 12 }, // Current Acct #
      { wch: 32 }, // Current Account Name
      { wch: 15 }, // Current Debit
      { wch: 15 }, // Current Credit
      { wch: 15 }, // Change
    ];
    wsRecon['!freeze'] = { xSplit: 0, ySplit: 1, topLeftCell: 'A2' };
    wsRecon['!autofilter'] = { ref: `A1:K${ledgerData.length}` };

    const acctFmt = '#,##0.00';
    for (let r = 1; r < ledgerData.length; r++) {
      for (const c of [4, 5, 8, 9, 10]) {
        const ref = XLSX.utils.encode_cell({ r, c });
        if (wsRecon[ref]) wsRecon[ref].z = acctFmt;
      }
    }

    XLSX.utils.book_append_sheet(wb, wsRecon, 'Reconciliation');

    // ── Summary sheet ─────────────────────────────────────────────────
    const summaryRows = [
      ['Reconciliation Summary', ''],
      [],
      ['Prior Year File', prevFile],
      ['Current Year File', currFile],
      [],
      ['Prior Year — Total Debits',  prevTB.totalDr],
      ['Prior Year — Total Credits', prevTB.totalCr],
      ['Prior Year — Balanced',      prevTB.balanced ? 'Yes' : `No (off by ${prevTB.diff})`],
      [],
      ['Current Year — Total Debits',  currTB.totalDr],
      ['Current Year — Total Credits', currTB.totalCr],
      ['Current Year — Balanced',      currTB.balanced ? 'Yes' : `No (off by ${currTB.diff})`],
      [],
      ['Matched Accounts', matchedCount],
      ['Added Accounts',   added.length],
      ['Removed Accounts', removed.length],
    ];
    const wsSummary = XLSX.utils.aoa_to_sheet(summaryRows);

    wsSummary['!cols'] = [{ wch: 30 }, { wch: 42 }];
    wsSummary['!merges'] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 1 } }];
    for (const [r, c] of [[5,1],[6,1],[9,1],[10,1]]) {
      const ref = XLSX.utils.encode_cell({ r, c });
      if (wsSummary[ref]) wsSummary[ref].z = acctFmt;
    }

    XLSX.utils.book_append_sheet(wb, wsSummary, 'Summary');

    // ── Added & Removed sheet ─────────────────────────────────────────
    const changesRows = [['Change', 'Account #', 'Account Name', 'Category']];
    for (const cat of categories) {
      for (const row of cat.rows) {
        if (row.status === 'added'   && row.curr) changesRows.push(['Added',   row.curr.num || '', row.curr.name, cat.name]);
        if (row.status === 'removed' && row.prev) changesRows.push(['Removed', row.prev.num || '', row.prev.name, cat.name]);
      }
    }
    const wsChanges = XLSX.utils.aoa_to_sheet(changesRows);
    wsChanges['!cols'] = [{ wch: 10 }, { wch: 13 }, { wch: 36 }, { wch: 22 }];
    wsChanges['!freeze'] = { xSplit: 0, ySplit: 1, topLeftCell: 'A2' };
    if (changesRows.length > 1) {
      wsChanges['!autofilter'] = { ref: `A1:D${changesRows.length}` };
    }

    XLSX.utils.book_append_sheet(wb, wsChanges, 'Added & Removed');

    XLSX.writeFile(wb, 'reconciliation_results.xlsx');
  }

  // Opens the browser's print dialog scoped to the results (via @media print rules
  // below) — the user can choose "Save as PDF" as the destination.
  function exportPDF() {
    if (!lastResults) return;
    window.print();
  }

  function scrollToAcct(rowId) {
    const el = document.getElementById(rowId);
    if (!el) return;
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    el.classList.remove('flash');
    void el.offsetWidth; // force reflow so re-triggering works
    el.classList.add('flash');
  }

  function resetAll() {
    clearSide('prev'); clearSide('curr');
    document.getElementById('results').style.display = 'none';
    document.getElementById('ai-progress').style.display = 'none';
    document.getElementById('error-container').innerHTML = '';
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
</body>
</html>
